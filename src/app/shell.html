<!DOCTYPE html>

<html lang="ko">
<head>
<meta content="no-cache, no-store, must-revalidate" http-equiv="Cache-Control"/>
<meta content="no-cache" http-equiv="Pragma"/>
<meta content="0" http-equiv="Expires"/>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>메가리그</title>

<link rel="stylesheet" href="./assets/app.css">
</head>
<body>
<div aria-hidden="false" class="startup-intro" id="startupIntro">
<svg aria-hidden="true" class="startup-defs" focusable="false" height="0" width="0"><defs><filter color-interpolation-filters="sRGB" height="160%" id="intro-wave" width="160%" x="-30%" y="-30%"><feTurbulence baseFrequency="0.007 0.016" numOctaves="2" result="n" seed="11" type="fractalNoise"><animate attributeName="baseFrequency" dur="2.2s" repeatCount="indefinite" values="0.007 0.016;0.012 0.026;0.007 0.016"/></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="58" xChannelSelector="R" yChannelSelector="G"/></filter></defs></svg>
<div class="startup-scene"><div class="intro-sky"></div><div class="intro-moon"></div><canvas class="intro-fire" aria-hidden="true"></canvas><svg class="intro-deco" viewBox="0 0 400 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg><div class="intro-burst"></div><svg class="intro-ground" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMin slice" aria-hidden="true"></svg><div class="intro-grave"><div class="intro-pair"><svg class="intro-hand" viewBox="0 0 200 400" aria-hidden="true"></svg><div class="intro-tomb"><i class="intro-tomb-glow"></i><span class="rip"></span><svg class="intro-claws" viewBox="0 -14 100 66" aria-hidden="true"></svg></div></div></div><svg class="intro-mound" viewBox="0 0 600 170" preserveAspectRatio="none" aria-hidden="true"></svg><div class="intro-candles"><i class="intro-candle" style="--cx:13%;--cd:0ms"></i><i class="intro-candle" style="--cx:22%;--cd:160ms"></i><i class="intro-candle" style="--cx:78%;--cd:80ms"></i><i class="intro-candle" style="--cx:88%;--cd:240ms"></i></div><div class="intro-dirt first"><i style="--dx:-120px;--dy:-150px;--dd:0ms;--ds:9px"></i><i style="--dx:-80px;--dy:-210px;--dd:40ms;--ds:7px"></i><i style="--dx:-40px;--dy:-170px;--dd:20ms;--ds:11px"></i><i style="--dx:10px;--dy:-230px;--dd:60ms;--ds:8px"></i><i style="--dx:55px;--dy:-190px;--dd:10ms;--ds:10px"></i><i style="--dx:95px;--dy:-160px;--dd:50ms;--ds:7px"></i><i style="--dx:135px;--dy:-120px;--dd:30ms;--ds:9px"></i><i style="--dx:-150px;--dy:-90px;--dd:70ms;--ds:6px"></i><i style="--dx:160px;--dy:-80px;--dd:80ms;--ds:6px"></i><i style="--dx:-20px;--dy:-120px;--dd:90ms;--ds:12px"></i><i style="--dx:70px;--dy:-110px;--dd:100ms;--ds:8px"></i><i style="--dx:-100px;--dy:-60px;--dd:40ms;--ds:10px"></i><i style="--dx:115px;--dy:-50px;--dd:20ms;--ds:9px"></i><i style="--dx:30px;--dy:-260px;--dd:110ms;--ds:6px"></i></div><div class="intro-dirt second"><i style="--dx:-120px;--dy:-150px;--dd:0ms;--ds:9px"></i><i style="--dx:-80px;--dy:-210px;--dd:40ms;--ds:7px"></i><i style="--dx:-40px;--dy:-170px;--dd:20ms;--ds:11px"></i><i style="--dx:10px;--dy:-230px;--dd:60ms;--ds:8px"></i><i style="--dx:55px;--dy:-190px;--dd:10ms;--ds:10px"></i><i style="--dx:95px;--dy:-160px;--dd:50ms;--ds:7px"></i><i style="--dx:135px;--dy:-120px;--dd:30ms;--ds:9px"></i><i style="--dx:-150px;--dy:-90px;--dd:70ms;--ds:6px"></i><i style="--dx:160px;--dy:-80px;--dd:80ms;--ds:6px"></i><i style="--dx:-20px;--dy:-120px;--dd:90ms;--ds:12px"></i><i style="--dx:70px;--dy:-110px;--dd:100ms;--ds:8px"></i><i style="--dx:-100px;--dy:-60px;--dd:40ms;--ds:10px"></i><i style="--dx:115px;--dy:-50px;--dd:20ms;--ds:9px"></i><i style="--dx:30px;--dy:-260px;--dd:110ms;--ds:6px"></i></div></div>
</div>
<div class="app">
<section class="screen active" id="setup">
<div class="league-select-shell">
<div class="league-chooser" id="leagueChooser"></div>
<div class="comprehensive-pattern-picker" hidden="" id="comprehensivePatternPicker">
<button class="composition-choice active" data-composition="2234"><span><strong>구성 A · 2☆ ×2 + 3☆ + 4☆</strong><span>저등급 기반 + 4☆ 핵심 한 장</span></span><span class="composition-pips"><i>2☆ ×2</i><i>3☆</i><i>4☆</i></span></button>
<button class="composition-choice" data-composition="2335"><span><strong>구성 B · 2☆ + 3☆ + 3.5☆ ×2</strong><span>중간 등급 중심의 균형 조합</span></span><span class="composition-pips"><i>2☆</i><i>3☆</i><i>3.5☆ ×2</i></span></button>
</div>
</div>
<div class="mode-tabs utility-tabs"><button id="aiModeBtn">AI 대 AI 시뮬레이션</button><button id="onlineBtn">온라인 대전</button><button id="menuCodexBtn">카드 도감</button></div>
<div class="setup-grid">
<div class="panel">
<h2 id="deckTitle">
              메가리그 덱 편성
              <span class="deck-count" id="deckCount">0 / 4</span>
</h2>
<p class="muted" id="deckHelp">리그를 선택하면 해당 규칙에 맞는 캐릭터 풀이 표시됩니다.</p>
<div class="cards-grid" id="deckCards"></div>
</div>
<div class="panel settings">
<h2>전투 설정</h2>
<select aria-hidden="true" hidden="" id="leagueMode"></select>
<label>AI 난이도<select id="difficulty">
<option value="normal">보통 (2수)</option>
<option value="hard">어려움 (반복 심화 3~4수)</option>
</select></label><label>피해 난수
              <input checked="" class="switch" id="variance" type="checkbox"/></label><label class="developer-seed-control">랜덤 시드<input id="seedInput" placeholder="비우면 무작위" type="text"/></label><label>전투 속도<select id="speed">
<option value="900">보통</option>
<option value="400">빠름</option>
<option value="80">매우 빠름</option>
</select></label>
<label>대전 주체<select id="mode">
<option value="human">플레이어 대 AI</option>
<option value="aivai">AI 대 AI 자동 전투</option>
</select></label><button id="randomDeck">무작위 덱</button>
<button class="primary" disabled="" id="startBtn">전투 시작</button>
<hr/>
<h3>빠른 밸런스 검증</h3>
<label>그룹별 시뮬레이션 수<input id="simCount" max="10000" min="100" step="100" type="number" value="1000"/></label><button id="simBtn">현재 리그 밸런스 검증 · 난수 ON/OFF 실행</button>
<div class="progress hidden" id="simProgress"><i></i></div>
<div class="tiny muted" id="simResult"></div>
</div>
</div>
</section>
<section class="screen" id="game">
<div class="battle">
<main class="arena">
<div class="turnstrip" id="turnStrip"></div>
<section class="side ai-side">
<div class="side-head">
<b>AI 진영</b><span id="aiAlive"></span>
</div>
<div class="zone-label">후열</div>
<div class="bench" id="aiBench"></div>
<div class="zone-label">필드</div>
<div class="slots" id="aiSlots"></div>
</section>
<section class="side player-side">
<div class="side-head">
<b>플레이어 진영</b><span id="playerAlive"></span>
</div>
<div class="zone-label">필드</div>
<div class="slots" id="playerSlots"></div>
<div class="zone-label">후열</div>
<div class="bench" id="playerBench"></div>
</section>
<div class="actions" id="actions">
<b id="actionTitle">행동 선택</b>
<div class="muted tiny" id="actionHint"></div>
<div class="action-buttons" id="actionButtons"></div>
</div>
</main>
<aside class="panel log-panel" id="logPanel">
<div class="side-head">
<b>전투 로그</b><button id="collapseLog">접기</button>
</div>
<div class="log" id="log"></div>
</aside>
</div>
</section>
</div>
<div class="modal" id="modal">
<div class="modalbox">
<button id="closeModal" style="float: right">닫기</button>
<div id="modalContent"></div>
</div>
</div>

<!-- InvaderPortalView R21: shared markup/state, original design preserved -->

<script type="module" src="./assets/app.js"></script>
</body>
</html>
