name: PR 120-122 Regression Verification
on:
  push:
    branches:
      - test/regression-120-122-20261031
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build application bundle
        run: npm run build
      - name: Static validation
        run: npm run validate:static
      - name: Unit tests
        run: npm test
      - name: Existing Weller browser tests
        run: node tools/check-weller.js
      - name: PR 120-122 browser regression
        run: node tests/regression/pr120-122-runner.mjs
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr120-122-regression
          path: |
            artifacts/regression/
            artifacts/weller/
            artifacts/build/sizes.json
          if-no-files-found: warn
