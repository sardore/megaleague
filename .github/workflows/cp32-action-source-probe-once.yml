name: CP32 Action Source Probe Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cp32-action-source-probe-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Extract action rendering contexts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          needles=['function renderActions','renderActions =','actionButtons','skillbtn','에너지 모으기','legalActions','manualLegalAction','data-action','dataset.action','renderAction']
          out=[]
          for needle in needles:
            starts=[]; pos=0
            while True:
              i=text.find(needle,pos)
              if i<0: break
              starts.append(i); pos=i+len(needle)
            out.append(f'===== {needle} count={len(starts)} =====')
            for n,i in enumerate(starts[:20],1):
              a=max(0,i-2200); b=min(len(text),i+5200)
              out.append(f'--- {needle} #{n} offset={i} ---\n{text[a:b]}')
          Path('CP32_ACTION_SOURCE_PROBE.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          rm -f .github/workflows/cp32-action-source-probe-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CP32_ACTION_SOURCE_PROBE.txt .github/workflows/cp32-action-source-probe-once.yml
          git commit -m 'Record action rendering source probe'
          git push origin HEAD:main
