name: CP32 Online Modal Close Owner Fix Once

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cp32-close-owner-fix-once.yml'
  push:
    branches: [ci/real-relay-e2e]
    paths:
      - '.github/workflows/cp32-close-owner-fix-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'ci/real-relay-e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CP32_RELAY_SOURCE_SHA: e6b97f0e63298d0766fc179bcfe76e80c2df44eb
      CP32_CURRENT_APP_URL: http://127.0.0.1:4173/?relay=ws%3A%2F%2F127.0.0.1%3A8787%2Fonline
      CP32_REAL_RELAY_ARTIFACTS: artifacts/real-relay
      CLOSE_OLD_1: 
      CLOSE_NEW_1: 
      CLOSE_OLD_2: ICAgIGNvbnN0IGVudHJ5SW50ZW50U25hcHNob3QgPSAoKSA9PiBPYmplY3QuZnJlZXplKHsuLi5lbnRyeUludGVudFN0YXRlfSk7CiAgICBjb25zdCBVSUNvbnRyb2xsZXJSdW50aW1lID0gT2JqZWN0LmZyZWV6ZSh7CiAgICAgIGhhbmRsZU1haW5PbmxpbmVFbnRyeShldmVudCkgew==
      CLOSE_NEW_2: 
      CLOSE_OLD_3: 
      CLOSE_NEW_3: ICAgICAgcmV0dXJuVG9TZXR1cChyZWFzb249InJlc3VsdC10by1zZXR1cCIpIHtyZXR1cm4gcmV0dXJuT25saW5lUnVudGltZVRvU2V0dXAocmVhc29uKTt9LA==
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/real-relay-e2e
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Apply canonical OnlineRuntime modal ownership fix
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-relay
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,os
          p=Path('index.html'); data=p.read_bytes(); before=hashlib.sha256(data).hexdigest(); text=data.decode()
          if before!='5910e01ac481019f5b3ba896748e2e278b47ae2a827ddcf275891a2e2913c6fd': raise SystemExit(f'CLOSE_SOURCE_SHA:{before}')
          for i in range(1,4):
            old=base64.b64decode(os.environ[f'CLOSE_OLD_{i}']).decode(); new=base64.b64decode(os.environ[f'CLOSE_NEW_{i}']).decode()
            if text.count(old)!=1 or text.count(new)!=0: raise SystemExit(f'CLOSE_PREIMAGE_{i}:old={text.count(old)} new={text.count(new)}')
            text=text.replace(old,new,1)
          p.write_text(text,encoding='utf-8',newline='')
          after=p.read_bytes(); Path('artifacts/real-relay/close-owner-sha.txt').write_text(f'before={before}\nafter={hashlib.sha256(after).hexdigest()}\nsize={len(after)}\n')
          print(Path('artifacts/real-relay/close-owner-sha.txt').read_text())
          PY
      - name: Syntax check current app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',Path('index.html').read_text(),flags=re.I|re.S)
          if len(scripts)!=12: raise SystemExit(f'SCRIPT_COUNT:{len(scripts)}')
          for i,s in enumerate(scripts):
            f=Path(tempfile.gettempdir())/f'close-{i}.js'; f.write_text(s); r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
            if r.returncode: print(r.stderr); raise SystemExit(f'SYNTAX:{i}')
          print('INLINE_SCRIPT_SYNTAX_PASS:12')
          PY
      - name: Install E2E
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start exact relay and app
        run: |
          git clone --no-checkout https://github.com/sardore/cp32-online-relay.git relay-src
          git -C relay-src checkout --detach "$CP32_RELAY_SOURCE_SHA"
          test "$(git -C relay-src rev-parse HEAD)" = "$CP32_RELAY_SOURCE_SHA"
          CP32_RELAY_HOST=127.0.0.1 CP32_RELAY_PORT=8787 node relay-src/server.js > artifacts/real-relay/relay.stdout.log 2> artifacts/real-relay/relay.stderr.log & echo $! > artifacts/real-relay/relay.pid
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/real-relay/app.stdout.log 2> artifacts/real-relay/app.stderr.log & echo $! > artifacts/real-relay/app.pid
          for i in $(seq 1 60); do curl --fail --silent http://127.0.0.1:4173/ >/dev/null 2>&1 && grep -q '"status":"ready"' artifacts/real-relay/relay.stdout.log && break; sleep .25; done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          grep -q '"status":"ready"' artifacts/real-relay/relay.stdout.log
      - name: Verify close owner plus preserved form and online path
        run: npx playwright test tests/e2e/current-real-relay-close.spec.js tests/e2e/current-real-relay-form-stability.spec.js tests/e2e/current-real-relay.spec.js --workers=1
      - name: Commit verified core edit
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cp32-close-owner-fix-once.yml
          git add index.html
          git diff --cached --check
          git commit -m 'Route online modal close through runtime lifecycle owner'
          git push origin HEAD:ci/real-relay-e2e
      - name: Stop processes
        if: always()
        run: |
          for f in artifacts/real-relay/*.pid; do [ -f "$f" ] && kill "$(cat "$f")" 2>/dev/null || true; done
