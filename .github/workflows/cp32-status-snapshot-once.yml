name: CP32 One-shot Gate Snapshot

on:
  push:
    branches:
      - test/randomized-battle-background-chaos-r1
    paths:
      - .github/workflows/cp32-status-snapshot-once.yml

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      MAIN_SHA: 5a27f0c44cd3ede6d42168c3285dd9016efe4037
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/randomized-battle-background-chaos-r1
      - name: Snapshot gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          token=os.environ['GH_TOKEN']; repo=os.environ['GITHUB_REPOSITORY']; sha=os.environ['MAIN_SHA']
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
            req=urllib.request.Request(url,headers=headers)
            with urllib.request.urlopen(req) as r:return json.load(r)
          def runs(workflow,event=None):
            q=f'?branch=main&per_page=30'+(f'&event={event}' if event else '')
            d=get(f'https://api.github.com/repos/{repo}/actions/workflows/{workflow}/runs{q}')
            return [{k:x.get(k) for k in ('id','name','run_number','event','head_sha','status','conclusion','html_url','created_at','updated_at')} for x in d.get('workflow_runs',[]) if x.get('head_sha')==sha]
          out={'mainSha':sha,'exact':runs('cp32-current-real-relay-e2e.yml','push'),'production':runs('cp32-production-e2e.yml','push'),'android':runs('cp32-android-background-e2e.yml','workflow_dispatch')}
          open('.cp32-current-gates.json','w').write(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .cp32-current-gates.json
          git commit -m 'Record current post-merge gate status'
          git push origin HEAD:test/randomized-battle-background-chaos-r1
