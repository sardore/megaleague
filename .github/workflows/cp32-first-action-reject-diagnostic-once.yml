name: CP32 First Action Reject Diagnostic Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cp32-first-action-reject-diagnostic-once.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CP32_RELAY_SOURCE_SHA: e6b97f0e63298d0766fc179bcfe76e80c2df44eb
      CP32_CURRENT_APP_URL: http://127.0.0.1:4173/?relay=ws%3A%2F%2F127.0.0.1%3A8787%2Fonline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Extract IdFactory and transaction source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path('index.html').read_text(encoding='utf-8')
          needles=['IdFactory =','IdFactory=','transaction(', 'transactionId:', 'ACTION_TRANSACTION_ROLLED_BACK','classifyR48Execution','function executeCoreBase','function playerGather']
          out=[]
          for needle in needles:
            pos=0; found=[]
            while True:
              i=text.find(needle,pos)
              if i<0: break
              found.append(i); pos=i+len(needle)
            out.append(f'===== {needle} count={len(found)} =====')
            for n,i in enumerate(found[:30],1):
              a=max(0,i-3500); b=min(len(text),i+8000)
              out.append(f'--- {needle} #{n} offset={i} ---\n{text[a:b]}')
          Path('CP32_FIRST_ACTION_SOURCE_DIAGNOSTIC.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Start exact relay and app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/first-action
          git clone --no-checkout https://github.com/sardore/cp32-online-relay.git relay-src
          git -C relay-src checkout --detach "$CP32_RELAY_SOURCE_SHA"
          CP32_RELAY_HOST=127.0.0.1 CP32_RELAY_PORT=8787 node relay-src/server.js > artifacts/first-action/relay.log 2>&1 &
          echo $! > artifacts/first-action/relay.pid
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/first-action/app.log 2>&1 &
          echo $! > artifacts/first-action/app.pid
          sleep 1
      - name: Run first-action runtime diagnostic
        shell: bash
        run: |
          cat > tests/e2e/__first-action-reject-diag.spec.js <<'JS'
          import { test, expect, chromium } from '@playwright/test';
          import fs from 'node:fs'; import os from 'node:os'; import path from 'node:path';
          import { pairByRoomCode, selectFour, waitRemoteCount, startBattle } from '../helpers/player-path.js';
          const APP=process.env.CP32_CURRENT_APP_URL; const OUT='CP32_FIRST_ACTION_REJECT_DIAGNOSTIC.json';
          async function launch(name){const dir=fs.mkdtempSync(path.join(os.tmpdir(),`fa-${name}-`));const context=await chromium.launchPersistentContext(dir,{headless:true,viewport:{width:412,height:915},deviceScaleFactor:2.625,hasTouch:true,isMobile:true,userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'});const page=context.pages()[0]||await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(`page:${e}`));page.on('console',m=>{if(m.type()==='error')errors.push(`console:${m.text()}`)});return{name,context,page,errors};}
          async function snap(page){return page.evaluate(()=>{const d=window.OnlineRuntime?.debug?.()||null;const pair=game?.order?.[game?.turn]||[];const u=pair.length?unitAt(game,pair[0],pair[1]):null;return{runtime:d,state:{phase:game?.phase||null,turn:game?.turn,turnSerial:Number(game?.turnSerial??-1),activeTeamId:game?.activeTeamId||null,activeEntityId:game?.activeEntityId||null,pendingAction:game?.pendingAction?JSON.parse(JSON.stringify(game.pendingAction)):null,pendingTransaction:game?.pendingTransaction?{transactionId:game.pendingTransaction.transactionId,actionId:game.pendingTransaction.actionId,teamId:game.pendingTransaction.teamId,slot:game.pendingTransaction.slot,action:JSON.parse(JSON.stringify(game.pendingTransaction.action||null))}:null,actor:u?{uid:u.uid,name:u.name,energy:JSON.parse(JSON.stringify(u.energy||[])),hp:u.hp}:null,statsTurns:Number(game?.stats?.turns||0)},audit:window.TransactionAuditChannel?.snapshot?.()||null,locks:window.InputLockManager?.snapshot?.()||null,events:(game?.eventLog||[]).slice(-30).map(e=>({sequence:e.sequence,type:e.type,payload:e.payload,teamId:e.teamId,sourceEntityId:e.sourceEntityId})),actionButtons:[...document.querySelectorAll('#actionButtons button:not([disabled])')].map((b,i)=>({i,text:(b.textContent||'').replace(/\s+/g,' ').trim(),html:b.innerHTML.slice(0,1000)}))};});}
          test('first real online action must mutate canonical turn',async()=>{test.setTimeout(120000);const h=await launch('h'),g=await launch('g');try{await Promise.all([h.page.goto(APP,{waitUntil:'domcontentloaded'}),g.page.goto(APP,{waitUntil:'domcontentloaded'})]);await pairByRoomCode(h.page,g.page);await selectFour(h.page);await waitRemoteCount(g.page,4);await selectFour(g.page);await waitRemoteCount(h.page,4);await startBattle(h.page,g.page);await expect.poll(async()=>{const [hc,gc]=await Promise.all([h.page.locator('#actionButtons button:not([disabled]):visible').count(),g.page.locator('#actionButtons button:not([disabled]):visible').count()]);return hc+gc;},{timeout:45000}).toBe(1);const hc=await h.page.locator('#actionButtons button:not([disabled]):visible').count();const actor=hc?h:g;const peer=hc?g:h;const before=await snap(actor.page);const button=actor.page.locator('#actionButtons button:not([disabled]):visible').first();await button.tap();await actor.page.waitForTimeout(2500);const afterActor=await snap(actor.page);const afterPeer=await snap(peer.page);fs.writeFileSync(OUT,JSON.stringify({actor:actor.name,before,afterActor,afterPeer,hostErrors:h.errors,guestErrors:g.errors},null,2));}finally{await Promise.allSettled([h.context.close(),g.context.close()]);}});
          JS
          set +e
          npx playwright test tests/e2e/__first-action-reject-diag.spec.js --workers=1 --reporter=line > artifacts/first-action/test.log 2>&1
          echo $? > artifacts/first-action/exit.txt
          set -e
      - name: Record diagnostic and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('CP32_FIRST_ACTION_REJECT_DIAGNOSTIC.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          d['test_exit_code']=int(pathlib.Path('artifacts/first-action/exit.txt').read_text().strip() or 99) if pathlib.Path('artifacts/first-action/exit.txt').exists() else 99
          d['test_log_tail']=pathlib.Path('artifacts/first-action/test.log').read_text(errors='replace').splitlines()[-100:] if pathlib.Path('artifacts/first-action/test.log').exists() else []
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          kill "$(cat artifacts/first-action/app.pid)" "$(cat artifacts/first-action/relay.pid)" 2>/dev/null || true
          rm -f .github/workflows/cp32-first-action-reject-diagnostic-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CP32_FIRST_ACTION_REJECT_DIAGNOSTIC.json CP32_FIRST_ACTION_SOURCE_DIAGNOSTIC.txt .github/workflows/cp32-first-action-reject-diagnostic-once.yml
          git commit -m 'Record first online action rejection diagnostic'
          git push origin HEAD:main
