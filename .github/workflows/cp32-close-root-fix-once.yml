name: CP32 Structural Hardening Once

on:
  push:
    branches: [ci/real-relay-e2e]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      CP32_RELAY_SOURCE_SHA: e6b97f0e63298d0766fc179bcfe76e80c2df44eb
      CP32_CURRENT_APP_URL: http://127.0.0.1:4173/?relay=ws%3A%2F%2F127.0.0.1%3A8787%2Fonline
      CP32_LOCAL_RELAY: ws://127.0.0.1:8787/online
      CP32_REAL_RELAY_ARTIFACTS: artifacts/real-relay
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/real-relay-e2e
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Apply ownership fixes directly to core source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-relay
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('index.html')
          data=p.read_bytes()
          before=hashlib.sha256(data).hexdigest()
          if before != '544b216fdc6bc45c59582981c0de4962b8db0d00cb84634e2e060651eb319da0':
              raise SystemExit(f'CORE_SOURCE_SHA_MISMATCH:{before}')
          s=data.decode('utf-8')

          replacements=[]

          old_close='''      const projectLobbyBase=reason=>{hideCardTooltip();NavigationApplication.projectSurface("setup",`online-lobby-base:${reason||"projection"}`);document.documentElement.dataset.onlineActiveSurface="LOBBY";document.body.classList.add("online-lobby-open");return true;};'''
          new_close='''      const projectLobbyBase=reason=>{hideCardTooltip();NavigationApplication.projectSurface("setup",`online-lobby-base:${reason||"projection"}`);markModal("LOBBY");document.documentElement.dataset.onlineActiveSurface="LOBBY";document.body.classList.add("online-lobby-open");return true;};'''
          replacements.append(('lobby-surface-owner',old_close,new_close))

          old_family='''        group(ref) { return card(ref)?.formGroup || null; },
        next(ref) {'''
          new_family='''        group(ref) { return card(ref)?.formGroup || null; },
        poolAnchor(ref) {
          const id = typeof ref === "string" ? ref : ref?.id || ref?.card;
          const def = CARDS.find(c => c.id === id);
          if (!def?.formGroup) return def || null;
          const anchorId = this.members(def.formGroup)[0] || def.id;
          return CARDS.find(c => c.id === anchorId) || def;
        },
        next(ref) {'''
          replacements.append(('form-family-pool-anchor',old_family,new_family))

          old_sort='''          return out.sort((leftId, rightId) => {
            const left = CARDS.find(card => card.id === leftId), right = CARDS.find(card => card.id === rightId);
            return Number.parseFloat(String(right?.grade || "0")) - Number.parseFloat(String(left?.grade || "0"));
          });'''
          new_sort='''          return out.sort((leftId, rightId) => {
            const left = FormFamilyOwner.poolAnchor(leftId), right = FormFamilyOwner.poolAnchor(rightId);
            return Number.parseFloat(String(right?.grade || "0")) - Number.parseFloat(String(left?.grade || "0"));
          });'''
          replacements.append(('stable-form-family-placement',old_sort,new_sort))

          for name, old, new in replacements:
              count=s.count(old)
              if count != 1:
                  raise SystemExit(f'{name}:PREIMAGE_COUNT:{count}')
              s=s.replace(old,new,1)
              print('APPLIED',name)

          p.write_text(s,encoding='utf-8',newline='')
          after=hashlib.sha256(p.read_bytes()).hexdigest()
          Path('artifacts/real-relay/structural-hardening-sha.txt').write_text(f'before={before}\nafter={after}\nsize={p.stat().st_size}\n')
          print(Path('artifacts/real-relay/structural-hardening-sha.txt').read_text())
          PY

      - name: Check all inline scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          if len(scripts) != 12: raise SystemExit(f'INLINE_SCRIPT_COUNT:{len(scripts)}')
          for i,s in enumerate(scripts):
              f=Path(tempfile.gettempdir())/f'cp32-structural-hardening-{i}.js'
              f.write_text(s,encoding='utf-8')
              r=subprocess.run(['node','--check',str(f)],capture_output=True,text=True)
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'INLINE_SCRIPT_SYNTAX_FAIL:{i}')
          print('INLINE_SCRIPT_SYNTAX_PASS:12')
          PY

      - name: Install E2E dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check out exact relay source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/sardore/cp32-online-relay.git relay-src
          git -C relay-src checkout --detach "$CP32_RELAY_SOURCE_SHA"
          test "$(git -C relay-src rev-parse HEAD)" = "$CP32_RELAY_SOURCE_SHA"
          node --check relay-src/server.js

      - name: Start exact relay and patched app
        shell: bash
        run: |
          set -euo pipefail
          CP32_RELAY_HOST=127.0.0.1 CP32_RELAY_PORT=8787 node relay-src/server.js > artifacts/real-relay/relay.stdout.log 2> artifacts/real-relay/relay.stderr.log &
          echo $! > artifacts/real-relay/relay.pid
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/real-relay/app.stdout.log 2> artifacts/real-relay/app.stderr.log &
          echo $! > artifacts/real-relay/app.pid
          for i in $(seq 1 60); do
            APP_OK=0; RELAY_OK=0
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null 2>&1 && APP_OK=1 || true
            grep -q '"status":"ready"' artifacts/real-relay/relay.stdout.log 2>/dev/null && RELAY_OK=1 || true
            if [ "$APP_OK" = 1 ] && [ "$RELAY_OK" = 1 ]; then break; fi
            sleep .25
          done
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null
          grep -q '"status":"ready"' artifacts/real-relay/relay.stdout.log

      - name: Run form, close, reconnect, long-battle and scheduled-action regressions
        run: npx playwright test tests/e2e/current-real-relay*.spec.js --workers=1

      - name: Commit only verified core source and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cp32-close-root-fix-once.yml
          git add index.html tests/e2e/current-real-relay-stress.spec.js
          git diff --cached --check
          git commit -m 'Stabilize form-family placement and online lifecycle ownership'
          git push origin HEAD:ci/real-relay-e2e

      - name: Preserve evidence
        if: always()
        shell: bash
        run: |
          set +e
          sha256sum index.html > artifacts/real-relay/patched-index.sha256 2>/dev/null || true
          ps -ef > artifacts/real-relay/processes.txt 2>/dev/null || true
          for f in artifacts/real-relay/*.pid; do [ -f "$f" ] || continue; kill "$(cat "$f")" 2>/dev/null || true; done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-structural-hardening-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          include-hidden-files: true
