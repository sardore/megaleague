name: CP32 Android Background E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: macos-14
    timeout-minutes: 180
    env:
      CP32_TARGET_MODE: candidate
      CP32_RELAY_ENDPOINT: wss://cp32-online-relay.onrender.com/online
      CP32_CANDIDATE_ORIGIN: https://127.0.0.1:8443
      CP32_ANDROID_CANDIDATE_URL: https://10.0.2.2:8443/?relay=wss%3A%2F%2Fcp32-online-relay.onrender.com%2Fonline
      CP32_PEER_CANDIDATE_URL: https://127.0.0.1:8443/?relay=wss%3A%2F%2Fcp32-online-relay.onrender.com%2Fonline
    steps:
      - uses: actions/checkout@v6
      - name: Initialize validation evidence filesystem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/preflight artifacts/results artifacts/android
          python3 - <<'PYEVIDENCEINIT'
          import json, os
          from pathlib import Path
          p=Path('artifacts/preflight/artifact-lifecycle-init.json')
          p.write_text(json.dumps({
            'status':'INITIALIZED',
            'workflow':os.environ.get('GITHUB_WORKFLOW'),
            'job':os.environ.get('GITHUB_JOB'),
            'runId':os.environ.get('GITHUB_RUN_ID'),
            'sha':os.environ.get('GITHUB_SHA'),
            'directories':['artifacts/preflight','artifacts/results','artifacts/android']
          },indent=2)+'\n')
          PYEVIDENCEINIT
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install chromium
      - run: npm run validate:static
      - name: Generate scoped local TLS identity and trust contract
        shell: bash
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/preflight/key.pem -out artifacts/preflight/cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:10.0.2.2'
          SPKI="$(openssl x509 -in artifacts/preflight/cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)"
          [[ -n "$SPKI" ]] || { echo 'LOCAL_CANDIDATE_SPKI_DERIVATION_FAILED' >&2; exit 2; }
          echo "CP32_LOCAL_TRUST_CERT=$GITHUB_WORKSPACE/artifacts/preflight/cert.pem" >> "$GITHUB_ENV"
          echo "CP32_LOCAL_CERT_SPKI=$SPKI" >> "$GITHUB_ENV"
          printf '{"policy":"LOCAL_CERT_PLUS_SPKI_ONLY","trustCert":"artifacts/preflight/cert.pem","spkiSha256Base64":"%s","globalTlsDisable":false}\n' "$SPKI" > artifacts/preflight/local-tls-contract.json
      - name: Start candidate HTTPS server
        run: node tests/helpers/candidate-https-server.js > artifacts/preflight/candidate-server.stdout.log 2> artifacts/preflight/candidate-server.stderr.log & echo $! > artifacts/preflight/candidate-server.pid
      - name: Local TLS trust regression
        run: CP32_TLS_REGRESSION_OUTPUT=artifacts/preflight/tls-trust-regression.json node tools/tls-trust-regression.js
      - name: Candidate and relay preflight
        env:
          CP32_PREFLIGHT_MODE: candidate
          CP32_PREFLIGHT_OUTPUT: artifacts/preflight/android-preflight.json
        run: node tests/helpers/relay-preflight.js
      - name: Android actual lifecycle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node tests/android/android-background-player-path.js
      - name: Capture Android logcat
        if: always()
        shell: bash
        run: |
          set +e
          adb logcat -d > artifacts/android/logcat.txt 2> artifacts/android/logcat.stderr.log
          RC=$?
          set -e
          printf '{"exitCode":%s,"stdoutPath":"artifacts/android/logcat.txt","stderrPath":"artifacts/android/logcat.stderr.log"}\n' "$RC" > artifacts/preflight/android-logcat-capture.json
      - name: Validate required evidence on successful run
        shell: bash
        run: |
          set -euo pipefail
          required=(
            artifacts/preflight/artifact-lifecycle-init.json
            artifacts/preflight/key.pem
            artifacts/preflight/cert.pem
            artifacts/preflight/local-tls-contract.json
            artifacts/preflight/tls-trust-regression.json
            artifacts/preflight/android-preflight.json
            artifacts/preflight/candidate-server.stdout.log
            artifacts/preflight/candidate-server.stderr.log
            artifacts/preflight/candidate-server.pid
            artifacts/results/static-validation.json
            artifacts/android/android-result.json
            artifacts/android/logcat.txt
            artifacts/preflight/android-logcat-capture.json
          )
          missing=0
          for f in "${required[@]}"; do
            if [[ ! -e "$f" ]]; then echo "REQUIRED_EVIDENCE_MISSING:$f" >&2; missing=1; fi
          done
          [[ $missing -eq 0 ]] || exit 31
          python3 - <<'PYLOGCAT'
          import json
          from pathlib import Path
          rec=json.loads(Path('artifacts/preflight/android-logcat-capture.json').read_text())
          if rec.get('exitCode') != 0: raise SystemExit('ANDROID_LOGCAT_CAPTURE_FAILED')
          if Path('artifacts/android/logcat.txt').stat().st_size == 0: raise SystemExit('ANDROID_LOGCAT_EMPTY')
          PYLOGCAT
      - name: Finalize evidence lifecycle
        if: always()
        shell: bash
        env:
          CP32_JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/preflight artifacts/results artifacts/android
          python3 - <<'PYEVIDENCEFINAL'
          import json, os
          from pathlib import Path
          root=Path('artifacts'); init=root/'preflight/artifact-lifecycle-init.json'
          files=[str(p) for p in root.rglob('*') if p.is_file()]
          rec={'status':'FINALIZED','jobStatus':os.environ.get('CP32_JOB_STATUS'),'initObserved':init.exists(),'fileCount':len(files),'runId':os.environ.get('GITHUB_RUN_ID')}
          (root/'preflight/artifact-lifecycle-final.json').write_text(json.dumps(rec,indent=2)+'\n')
          PYEVIDENCEFINAL
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-android-evidence-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          include-hidden-files: true
