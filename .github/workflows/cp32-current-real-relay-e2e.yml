name: CP32 Current Real Relay E2E

on:
  workflow_dispatch:
  push:
    branches: [ci/real-relay-e2e, main]
    paths:
      - 'index.html'
      - 'tests/e2e/current-real-relay*.spec.js'
      - '.github/workflows/cp32-current-real-relay-e2e.yml'
      - 'tests/helpers/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/e2e/current-real-relay*.spec.js'
      - '.github/workflows/cp32-current-real-relay-e2e.yml'
      - 'tests/helpers/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: write

jobs:
  patch-authoritative-revision:
    if: github.event_name == 'pull_request' && github.head_ref == 'diagnose/android-lifecycle-32624812975'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnose/android-lifecycle-32624812975
          fetch-depth: 1
      - name: Patch canonical revision idempotency and push branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='Publication order is not canonical mutation order.'
          if marker in s:
              print('AUTHORITATIVE_REVISION_PATCH_ALREADY_PRESENT')
              raise SystemExit(0)
          old='''        const currentRevision=Math.max(Number(onlineAuthoritativeRevision||0),Number(game.networkRevision||0));
        onlineAuthoritativeRevision=force?currentRevision:currentRevision+1;
        game.networkRevision = onlineAuthoritativeRevision;
        const revision = onlineAuthoritativeRevision;
        // Transport availability cannot veto an already committed host mutation. Advance the
        // canonical revision first; onlineSafeSend may fail and the same immutable revision is
        // then retained by the single reliable-state retry owner below.'''
          new='''        // Publication order is not canonical mutation order. A resend of the same
        // canonical state must reuse its committed revision, even when it comes through the
        // ordinary publication path rather than a force/recovery path. Compare against the
        // last immutable PVP canonical packet while ignoring transport revision metadata.
        const previousCanonicalState=!bossOnline&&typeof p2p?.__reliableStatePacket?.state==="string"
          ? p2p.__reliableStatePacket.state
          : null;
        const currentCanonicalState=bossOnline?null:serializeOnlineGame();
        const canonicalChanged=bossOnline
          ? !force
          : previousCanonicalState===null
            ? !force
            : !onlineSnapshotEquivalentForInput(previousCanonicalState,currentCanonicalState);
        const currentRevision=Math.max(Number(onlineAuthoritativeRevision||0),Number(game.networkRevision||0));
        onlineAuthoritativeRevision=canonicalChanged?currentRevision+1:currentRevision;
        game.networkRevision = onlineAuthoritativeRevision;
        const revision = onlineAuthoritativeRevision;
        // Transport availability cannot veto an already committed host mutation. When the
        // canonical state actually changed, advance the revision before delivery; otherwise
        // retain the existing revision so retries/resends cannot manufacture canonical history.'''
          count=s.count(old)
          if count != 1:
              raise SystemExit(f'AUTHORITATIVE_REVISION_PATCH_TARGET_COUNT:{count}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          if git diff --quiet -- index.html; then
            exit 0
          fi
          git diff --check
          grep -q 'Publication order is not canonical mutation order' index.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Reuse authoritative revision for unchanged resends'
          git push origin HEAD:diagnose/android-lifecycle-32624812975

  real-relay:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CP32_RELAY_SOURCE_SHA: e6b97f0e63298d0766fc179bcfe76e80c2df44eb
      CP32_CURRENT_APP_URL: http://127.0.0.1:4173/?relay=ws%3A%2F%2F127.0.0.1%3A8787%2Fonline
      CP32_LOCAL_RELAY: ws://127.0.0.1:8787/online
      CP32_REAL_RELAY_ARTIFACTS: artifacts/real-relay
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Initialize evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/real-relay
          sha256sum index.html | tee artifacts/real-relay/index.sha256
          wc -c index.html | tee artifacts/real-relay/index.size
          git rev-parse HEAD | tee artifacts/real-relay/megaleague-commit.txt

      - name: Check out exact relay source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/sardore/cp32-online-relay.git relay-src
          git -C relay-src checkout --detach "$CP32_RELAY_SOURCE_SHA"
          ACTUAL="$(git -C relay-src rev-parse HEAD)"
          printf '%s\n' "$ACTUAL" | tee artifacts/real-relay/relay-commit.txt
          test "$ACTUAL" = "$CP32_RELAY_SOURCE_SHA"

      - name: Syntax check current application scripts and relay
        shell: bash
        run: |
          set -euo pipefail
          node --check relay-src/server.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          if len(scripts) != 12:
              raise SystemExit(f'INLINE_SCRIPT_COUNT:{len(scripts)}')
          out=[]
          for i,s in enumerate(scripts):
              p=Path(tempfile.gettempdir())/f'cp32-current-inline-{i}.js'
              p.write_text(s,encoding='utf-8')
              r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
              out.append({'index':i,'ok':r.returncode==0,'stderr':r.stderr[-2000:]})
              if r.returncode:
                  print(r.stderr)
                  raise SystemExit(f'INLINE_SCRIPT_SYNTAX_FAIL:{i}')
          import json
          Path('artifacts/real-relay/inline-script-syntax.json').write_text(json.dumps(out,indent=2)+'\n')
          print(f'INLINE_SCRIPT_SYNTAX_PASS:{len(scripts)}')
          PY

      - name: Start exact relay source
        shell: bash
        run: |
          set -euo pipefail
          CP32_RELAY_HOST=127.0.0.1 CP32_RELAY_PORT=8787 node relay-src/server.js > artifacts/real-relay/relay.stdout.log 2> artifacts/real-relay/relay.stderr.log &
          echo $! > artifacts/real-relay/relay.pid

      - name: Serve current checkout index.html
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/real-relay/app.stdout.log 2> artifacts/real-relay/app.stderr.log &
          echo $! > artifacts/real-relay/app.pid

      - name: Real app and relay preflight
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep .25
          done
          curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null
          for i in $(seq 1 60); do
            if grep -q '"status":"ready"' artifacts/real-relay/relay.stdout.log && grep -q '"protocol":"cp32-online-relay-v1"' artifacts/real-relay/relay.stdout.log; then break; fi
            sleep .25
          done
          grep -q '"status":"ready"' artifacts/real-relay/relay.stdout.log
          grep -q '"protocol":"cp32-online-relay-v1"' artifacts/real-relay/relay.stdout.log
          node --input-type=module - <<'NODE'
          const url='ws://127.0.0.1:8787/online';
          await new Promise((resolve,reject)=>{
            const ws=new WebSocket(url);
            const t=setTimeout(()=>{try{ws.close()}catch{};reject(new Error('LOCAL_RELAY_OPEN_TIMEOUT'));},10000);
            ws.addEventListener('open',()=>{clearTimeout(t);ws.close();resolve();},{once:true});
            ws.addEventListener('error',()=>{clearTimeout(t);reject(new Error('LOCAL_RELAY_OPEN_ERROR'));},{once:true});
          });
          console.log('LOCAL_RELAY_WEBSOCKET_OPEN_PASS');
          NODE

      - name: Real mobile browser regressions against exact relay source
        run: npx playwright test tests/e2e/current-real-relay*.spec.js --workers=1

      - name: Preserve process logs and evidence
        if: always()
        shell: bash
        run: |
          set +e
          ps -ef > artifacts/real-relay/processes.txt
          for f in artifacts/real-relay/*.pid; do
            [ -f "$f" ] || continue
            pid="$(cat "$f")"
            kill "$pid" 2>/dev/null || true
          done

      - name: Upload real-relay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-current-real-relay-${{ github.run_id }}
          path: |
            artifacts/
            test-results/
          if-no-files-found: error
          include-hidden-files: true
