name: CP32 One-shot Chat Order Patch

on:
  push:
    branches:
      - test/randomized-battle-background-chaos-r1
    paths:
      - .github/workflows/cp32-chat-order-fix-once.yml

permissions:
  contents: write

jobs:
  patch-chat-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/randomized-battle-background-chaos-r1
          fetch-depth: 1
      - name: Patch deterministic chat ordering
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''          onlineChatMessages.push(message);\n          if (onlineChatMessages.length > 100) onlineChatMessages.splice(0, onlineChatMessages.length - 100);'''
          new = '''          onlineChatMessages.push(message);\n          // Delivery/restore order is not presentation order. Every peer sorts the same\n          // immutable message facts so late/retried packets converge to one transcript.\n          onlineChatMessages.sort((a,b) => {\n            const at=Number(a?.sentAt||0), bt=Number(b?.sentAt||0);\n            if(at!==bt)return at-bt;\n            return String(a?.id||\"\").localeCompare(String(b?.id||\"\"));\n          });\n          if (onlineChatMessages.length > 100) onlineChatMessages.splice(0, onlineChatMessages.length - 100);'''
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'CHAT_ORDER_PATCH_TARGET_COUNT:{count}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check
          grep -q 'Delivery/restore order is not presentation order' index.html
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Canonicalize online chat transcript order'
          git push origin HEAD:test/randomized-battle-background-chaos-r1
