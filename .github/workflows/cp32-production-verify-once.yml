name: CP32 Production Verify Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cp32-production-verify-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CP32_PRODUCTION_ORIGIN: https://sardore.github.io/megaleague/
      CP32_CURRENT_APP_URL: https://sardore.github.io/megaleague/?relay=wss%3A%2F%2Fcp32-online-relay.onrender.com%2Fonline
      CP32_LOCAL_RELAY: wss://cp32-online-relay.onrender.com/online
      CP32_RELAY_ENDPOINT: wss://cp32-online-relay.onrender.com/online
      CP32_REAL_RELAY_ARTIFACTS: artifacts/production-realworld
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify deployed bytes, relay, and full real-world suite
        shell: bash
        run: |
          set -uo pipefail
          expected="$(sha256sum index.html | awk '{print $1}')"
          deployed=''
          mkdir -p artifacts/production-realworld
          for i in $(seq 1 120); do
            probe="${CP32_PRODUCTION_ORIGIN}?__cp32_once=${GITHUB_SHA}-${i}"
            if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$probe" -o /tmp/pages.html; then
              deployed="$(sha256sum /tmp/pages.html | awk '{print $1}')"
              echo "probe=$i expected=$expected deployed=$deployed"
              [ "$deployed" = "$expected" ] && break
            fi
            sleep 5
          done
          deploy_rc=0
          [ "$deployed" = "$expected" ] || deploy_rc=41
          relay_rc=0
          node --input-type=module - <<'NODE' || relay_rc=$?
          const url=process.env.CP32_RELAY_ENDPOINT;
          await new Promise((resolve,reject)=>{
            const ws=new WebSocket(url);
            const t=setTimeout(()=>{try{ws.close()}catch{};reject(new Error('PRODUCTION_RELAY_OPEN_TIMEOUT'));},20000);
            ws.addEventListener('open',()=>{clearTimeout(t);ws.close();resolve();},{once:true});
            ws.addEventListener('error',()=>{clearTimeout(t);reject(new Error('PRODUCTION_RELAY_OPEN_ERROR'));},{once:true});
          });
          console.log('PRODUCTION_RELAY_WEBSOCKET_OPEN_PASS');
          NODE
          test_rc=0
          if [ "$deploy_rc" -eq 0 ] && [ "$relay_rc" -eq 0 ]; then
            npx playwright test tests/e2e/current-real-relay*.spec.js --workers=1 --reporter=line 2>&1 | tee /tmp/cp32-production-tests.log
            test_rc=${PIPESTATUS[0]}
          else
            printf 'suite skipped: deploy_rc=%s relay_rc=%s\n' "$deploy_rc" "$relay_rc" | tee /tmp/cp32-production-tests.log
            test_rc=42
          fi
          python3 - "$expected" "$deployed" "$deploy_rc" "$relay_rc" "$test_rc" <<'PY'
          import json,sys,os
          from pathlib import Path
          expected,deployed,deploy_rc,relay_rc,test_rc=sys.argv[1:]
          log=Path('/tmp/cp32-production-tests.log').read_text(errors='replace') if Path('/tmp/cp32-production-tests.log').exists() else ''
          lines=log.splitlines()
          data={
            'commit_under_test':os.environ.get('GITHUB_SHA'),
            'index_sha256_expected':expected,
            'index_sha256_deployed':deployed,
            'deploy_identity_ok':int(deploy_rc)==0,
            'relay_preflight_ok':int(relay_rc)==0,
            'test_exit_code':int(test_rc),
            'suite_ok':int(test_rc)==0,
            'production_url':os.environ.get('CP32_CURRENT_APP_URL'),
            'relay':os.environ.get('CP32_RELAY_ENDPOINT'),
            'log_tail':lines[-240:],
          }
          Path('CP32_PRODUCTION_VERIFICATION.json').write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cp32-production-verify-once.yml
          git add CP32_PRODUCTION_VERIFICATION.json
          git commit -m 'Record live production verification'
          git push origin HEAD:main
          if [ "$deploy_rc" -ne 0 ]; then exit "$deploy_rc"; fi
          if [ "$relay_rc" -ne 0 ]; then exit "$relay_rc"; fi
          exit "$test_rc"
