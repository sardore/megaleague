      - name: Decode and apply bounded R8 correction
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cp32-r8-correction"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          base64 -d "$RUNNER_TEMP/cp32-r8-correction.b64" > "$RUNNER_TEMP/cp32-r8-correction.tar.gz"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/cp32-r8-correction.tar.gz" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c%s "$RUNNER_TEMP/cp32-r8-correction.tar.gz")"
          printf '{"expectedSha256":"%s","actualSha256":"%s","expectedSize":%s,"actualSize":%s}\n' "$CP32_CORRECTION_PAYLOAD_SHA256" "$ACTUAL_SHA" "$CP32_CORRECTION_PAYLOAD_SIZE" "$ACTUAL_SIZE" > artifacts/bootstrap/r8-payload-identity.json
          [[ "$ACTUAL_SHA" == "$CP32_CORRECTION_PAYLOAD_SHA256" && "$ACTUAL_SIZE" == "$CP32_CORRECTION_PAYLOAD_SIZE" ]] || { echo R8_CORRECTION_PAYLOAD_IDENTITY_MISMATCH >&2; exit 2; }
          tar -xzf "$RUNNER_TEMP/cp32-r8-correction.tar.gz" -C "$STAGE"
          python3 - "$STAGE" <<'PYAPPLY'
          import json,shutil,sys
          from pathlib import Path
          stage=Path(sys.argv[1]); manifest=json.loads((stage/'R8_CORRECTION_MANIFEST.json').read_text()); root=Path('.')
          allowed=set(manifest['changedFiles'])
          for rel in allowed:
            src=stage/rel; dst=root/rel
            if not src.is_file(): raise SystemExit(f'R8_PAYLOAD_FILE_MISSING:{rel}')
            dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
          Path('artifacts/bootstrap/r8-changed-file-allowlist.json').write_text(json.dumps(sorted(allowed),indent=2)+'\n')
          PYAPPLY

      - name: Static ownership, R6 lifecycle, and R7 TLS preservation validation
        shell: bash
        run: |
          set -euo pipefail
          node tools/static-validation.js > artifacts/bootstrap/r8-static-validation.stdout.json
          ruby -e "require 'yaml'; ARGV.each { |f| YAML.load_file(f); puts 'YAML_OK '+f }" .github/workflows/cp32-trusted-candidate-e2e.yml .github/workflows/cp32-android-background-e2e.yml .github/workflows/cp32-production-e2e.yml > artifacts/bootstrap/r8-yaml-parse.log
          python3 - <<'PYLIFE'
          import json
          from pathlib import Path
          specs={
            '.github/workflows/cp32-trusted-candidate-e2e.yml':['resolved-package-lock.sha256','key.pem','cert.pem','candidate-server.stdout.log','candidate-server.stderr.log','candidate-server.pid','preflight.json'],
            '.github/workflows/cp32-android-background-e2e.yml':['key.pem','cert.pem','candidate-server.stdout.log','candidate-server.stderr.log','candidate-server.pid','android-preflight.json','logcat.txt'],
            '.github/workflows/cp32-production-e2e.yml':['production-preflight.json'],
          }
          out={}; bad=0
          for name,targets in specs.items():
            s=Path(name).read_text(); init=s.find('Initialize validation evidence filesystem'); rows=[]
            for target in targets:
              pos=s.find(target); ok=init>=0 and pos>init; rows.append({'target':target,'found':pos>=0,'afterInit':ok}); bad+=0 if ok else 1
            out[name]={'targets':rows,'pass':all(x['afterInit'] for x in rows)}
          out['ARTIFACT_WRITE_BEFORE_INIT']=bad
          Path('artifacts/bootstrap/r8-artifact-lifecycle.json').write_text(json.dumps(out,indent=2)+'\n')
          if bad: raise SystemExit('R6_ARTIFACT_LIFECYCLE_REGRESSION')
          PYLIFE
          mkdir -p artifacts/bootstrap/r8-tls
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/bootstrap/r8-tls/key.pem -out artifacts/bootstrap/r8-tls/cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:10.0.2.2' >/dev/null 2>&1
          SPKI="$(openssl x509 -in artifacts/bootstrap/r8-tls/cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)"
          export CP32_LOCAL_TRUST_CERT="$GITHUB_WORKSPACE/artifacts/bootstrap/r8-tls/cert.pem"
          export CP32_LOCAL_CERT_SPKI="$SPKI"
          export CP32_CANDIDATE_ORIGIN=https://127.0.0.1:9443
          export CP32_CANDIDATE_PORT=9443
          export CP32_TLS_CERT="$GITHUB_WORKSPACE/artifacts/bootstrap/r8-tls/cert.pem"
          export CP32_TLS_KEY="$GITHUB_WORKSPACE/artifacts/bootstrap/r8-tls/key.pem"
          node tests/helpers/candidate-https-server.js > artifacts/bootstrap/r8-tls/server.stdout.log 2> artifacts/bootstrap/r8-tls/server.stderr.log &
          SERVER_PID=$!
          cleanup_server(){ set +e; kill "$SERVER_PID" 2>/dev/null; wait "$SERVER_PID" 2>/dev/null; set -e; }
          trap cleanup_server EXIT
          for i in $(seq 1 100); do [[ -f artifacts/preflight/candidate-server-ready.json ]] && break; sleep .1; done
          CP32_TLS_REGRESSION_OUTPUT=artifacts/bootstrap/r8-tls/TLS_TRUST_REGRESSION.json node tools/tls-trust-regression.js
          cleanup_server
          trap - EXIT

      - name: Install harness regression runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Playwright runner ownership regression
        shell: bash
        env:
          CP32_TARGET_MODE: production
          CP32_HARNESS_BOOTSTRAP_ARTIFACT_BASE: artifacts/bootstrap/r8-harness-runner
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/harness-ownership-bootstrap.spec.js --workers=1
          CP32_HARNESS_SELF_CHECK_OUTPUT=artifacts/bootstrap/r8-harness-node.json node tools/harness-ownership-regression.js

      - name: Verify bounded diff and trusted source preservation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDIFF'
          import hashlib,json,subprocess,os
          from pathlib import Path
          allowed=set([".github/workflows/cp32-trusted-candidate-e2e.yml",".github/workflows/cp32-android-background-e2e.yml",".github/workflows/cp32-production-e2e.yml","playwright.config.js","tests/helpers/touch-input.js","tests/helpers/two-independent-clients.js","tests/helpers/evidence-recorder.js","tests/helpers/pair-lifecycle.js","tests/helpers/player-path.js","tests/helpers/diagnostic-export.js","tests/android/android-peer-client.js","tests/android/android-background-player-path.js","tests/e2e/gate-harness.js","tests/e2e/trusted-candidate-player-path.spec.js","tests/e2e/production-player-path.spec.js","tests/e2e/lobby-background-sync.spec.js","tests/e2e/result-setup-stability.spec.js","tests/e2e/harness-ownership-bootstrap.spec.js","tools/harness-ownership-regression.js","tools/static-validation.js"])
          diff=set(x for x in subprocess.check_output(['git','status','--porcelain=v1'],text=True).splitlines() for x in [x[3:]] if x and not x.startswith('artifacts/'))
          unexpected=sorted(diff-allowed); missing=sorted(allowed-diff)
          trusted=[]; ok=False
          for p in [Path('trusted/CP32_ACTIVE_WRAPPER_CUTOVER_TRUSTED_BASELINE_20260805T2220KST.html'),Path('validation/bootstrap/CP32_TRUSTED_CANDIDATE.html'),Path('validation/bootstrap/MOBILE_UPLOAD_02_CP32_TRUSTED_CANDIDATE.html')]:
            if not p.is_file(): continue
            b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest(); exact=sha==os.environ['CP32_EXPECTED_SHA256'] and len(b)==int(os.environ['CP32_EXPECTED_SIZE']) and os.environ['CP32_EXPECTED_BUILD'].encode() in b
            trusted.append({'path':str(p),'sha256':sha,'size':len(b),'exact':exact}); ok=ok or exact
          rec={'allowedChangedFiles':sorted(allowed),'observedChangedFiles':sorted(diff),'unexpected':unexpected,'missing':missing,'trusted':trusted,'trustedShaUnchanged':ok,'productionSourceMutationCount':0,'indexHtmlMutationCount':0,'relayMutationCount':0}
          Path('artifacts/bootstrap/r8-bounded-diff.json').write_text(json.dumps(rec,indent=2)+'\n')
          if unexpected or missing or not ok: raise SystemExit('R8_BOUNDED_DIFF_OR_TRUSTED_SOURCE_FAILURE')
          PYDIFF
          FALLBACK="$GITHUB_WORKSPACE/artifacts/bootstrap/cp32-player-path-harness-r8-ready.zip"
          zip -qr "$FALLBACK" '.github/workflows/cp32-trusted-candidate-e2e.yml' '.github/workflows/cp32-android-background-e2e.yml' '.github/workflows/cp32-production-e2e.yml' 'playwright.config.js' 'tests/helpers/touch-input.js' 'tests/helpers/two-independent-clients.js' 'tests/helpers/evidence-recorder.js' 'tests/helpers/pair-lifecycle.js' 'tests/helpers/player-path.js' 'tests/helpers/diagnostic-export.js' 'tests/android/android-peer-client.js' 'tests/android/android-background-player-path.js' 'tests/e2e/gate-harness.js' 'tests/e2e/trusted-candidate-player-path.spec.js' 'tests/e2e/production-player-path.spec.js' 'tests/e2e/lobby-background-sync.spec.js' 'tests/e2e/result-setup-stability.spec.js' 'tests/e2e/harness-ownership-bootstrap.spec.js' 'tools/harness-ownership-regression.js' 'tools/static-validation.js'
          sha256sum "$FALLBACK" > "$FALLBACK.sha256"

      - name: Commit bounded R8 correction locally
        id: localcommit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c cp32-player-path-harness-ownership-r1
          git add '.github/workflows/cp32-trusted-candidate-e2e.yml' '.github/workflows/cp32-android-background-e2e.yml' '.github/workflows/cp32-production-e2e.yml' 'playwright.config.js' 'tests/helpers/touch-input.js' 'tests/helpers/two-independent-clients.js' 'tests/helpers/evidence-recorder.js' 'tests/helpers/pair-lifecycle.js' 'tests/helpers/player-path.js' 'tests/helpers/diagnostic-export.js' 'tests/android/android-peer-client.js' 'tests/android/android-background-player-path.js' 'tests/e2e/gate-harness.js' 'tests/e2e/trusted-candidate-player-path.spec.js' 'tests/e2e/production-player-path.spec.js' 'tests/e2e/lobby-background-sync.spec.js' 'tests/e2e/result-setup-stability.spec.js' 'tests/e2e/harness-ownership-bootstrap.spec.js' 'tools/harness-ownership-regression.js' 'tools/static-validation.js'
          git diff --cached --check
          git commit -m 'Correct CP32 external player-path harness ownership'
          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "local_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$LOCAL_SHA" > artifacts/bootstrap/r8-local-commit-sha.txt

      - name: Authenticate, push R8 correction branch, verify remote, and create PR
        id: remote
        shell: bash
        env:
          CP32_BOOTSTRAP_PAT: ${{ secrets.CP32_BOOTSTRAP_PAT }}
        run: |
          set -euo pipefail
          STATUS_FILE="$GITHUB_WORKSPACE/artifacts/bootstrap/r8-remote-install-status.json"
          BASE="${{ github.event.repository.default_branch }}"
          BRANCH='cp32-player-path-harness-ownership-r1'
          LOCAL_SHA='${{ steps.localcommit.outputs.local_sha }}'
          GIT_AUTH_CONFIG="$RUNNER_TEMP/cp32-r8-gitconfig"
          REMOTE_SHA=''; PR_URL=''; PUSH_RC=99; PR_RC=99
          cleanup(){ set +e; unset GH_TOKEN CP32_BOOTSTRAP_PAT GIT_CONFIG_GLOBAL; rm -f "$GIT_AUTH_CONFIG"; set -e; }
          trap cleanup EXIT
          if [[ -z "${CP32_BOOTSTRAP_PAT:-}" ]]; then echo CP32_BOOTSTRAP_PAT_REQUIRED_FOR_WORKFLOW_FILE_INSTALL >&2; exit 21; fi
          export GH_TOKEN="$CP32_BOOTSTRAP_PAT"; export GIT_CONFIG_GLOBAL="$GIT_AUTH_CONFIG"; : > "$GIT_AUTH_CONFIG"; chmod 600 "$GIT_AUTH_CONFIG"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          gh api user --jq '{login:.login}' > artifacts/bootstrap/r8-api-identity.json 2> artifacts/bootstrap/r8-api-identity.stderr.log || { echo CP32_BOOTSTRAP_PAT_AUTH_FAILED >&2; exit 22; }
          gh api "repos/$GITHUB_REPOSITORY" --jq '{fullName:.full_name,defaultBranch:.default_branch,permissions:.permissions}' > artifacts/bootstrap/r8-api-repository-access.json 2> artifacts/bootstrap/r8-api-repository-access.stderr.log || { echo CP32_BOOTSTRAP_PAT_REPOSITORY_ACCESS_FAILED >&2; exit 26; }
          gh auth setup-git --hostname github.com --force > artifacts/bootstrap/r8-gh-auth-setup-git.stdout.log 2> artifacts/bootstrap/r8-gh-auth-setup-git.stderr.log || { echo CP32_BOOTSTRAP_GIT_CREDENTIAL_SETUP_FAILED >&2; exit 27; }
          git ls-remote origin "refs/heads/$BASE" > artifacts/bootstrap/r8-git-read-main.txt 2> artifacts/bootstrap/r8-git-read.stderr.log || { echo CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED >&2; exit 28; }
          EXISTING="$(git ls-remote origin "refs/heads/$BRANCH" 2> artifacts/bootstrap/r8-branch-check.stderr.log)" || { echo CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED >&2; exit 28; }
          if [[ -n "$EXISTING" ]]; then BRANCH="cp32-player-path-harness-ownership-r1-$GITHUB_RUN_ID"; git branch -m "$BRANCH"; fi
          set +e; git push -u origin "$BRANCH" > artifacts/bootstrap/r8-git-push.stdout.log 2> artifacts/bootstrap/r8-git-push.stderr.log; PUSH_RC=$?; set -e
          [[ $PUSH_RC -eq 0 ]] || { echo CP32_BOOTSTRAP_REMOTE_PUSH_FAILED >&2; exit 23; }
          REMOTE_LINE="$(git ls-remote origin "refs/heads/$BRANCH" 2> artifacts/bootstrap/r8-remote-branch-check.stderr.log)" || { echo CP32_BOOTSTRAP_REMOTE_BRANCH_OBSERVATION_TRANSPORT_FAILED >&2; exit 30; }
          REMOTE_SHA="${REMOTE_LINE%%[[:space:]]*}"
          [[ -n "$REMOTE_SHA" ]] || { echo CP32_BOOTSTRAP_REMOTE_BRANCH_NOT_OBSERVED >&2; exit 31; }
          [[ "$REMOTE_SHA" == "$LOCAL_SHA" ]] || { echo CP32_BOOTSTRAP_REMOTE_SHA_MISMATCH >&2; exit 32; }
          set +e; PR_URL="$(gh pr create --base "$BASE" --head "$BRANCH" --title 'Correct CP32 external player-path harness ownership' --body 'Bounded validation-infrastructure correction: one manual EvidenceRecorder trace owner, Playwright-native touch-capable persistent contexts, independent host/guest processes, canonical touchscreen input, and preserved R6 artifact/R7 TLS contracts. Trusted game HTML, index.html, and relay source are unchanged.' 2> artifacts/bootstrap/r8-pr-create.stderr.log)"; PR_RC=$?; set -e
          [[ $PR_RC -eq 0 && -n "$PR_URL" ]] || { echo CP32_BOOTSTRAP_PR_CREATE_FAILED >&2; exit 24; }
          gh pr view "$PR_URL" --json headRefName,baseRefName,state,url > artifacts/bootstrap/r8-pr-verification.json 2> artifacts/bootstrap/r8-pr-view.stderr.log || { echo CP32_BOOTSTRAP_PR_VERIFICATION_FAILED >&2; exit 25; }
          export PR_URL BRANCH BASE LOCAL_SHA REMOTE_SHA PUSH_RC PR_RC
          python3 - <<'PYSTATUS'
          import json,os
          pr=json.load(open('artifacts/bootstrap/r8-pr-verification.json'))
          ok=pr.get('headRefName')==os.environ['BRANCH'] and pr.get('baseRefName')==os.environ['BASE'] and pr.get('state')=='OPEN' and bool(pr.get('url'))
          if not ok: raise SystemExit('R8_PR_VERIFICATION_MISMATCH')
          rec={'status':'CP32_EXTERNAL_PLAYER_PATH_HARNESS_R8_PR_READY','branch':os.environ['BRANCH'],'base':os.environ['BASE'],'localCommitSha':os.environ['LOCAL_SHA'],'remoteCommitSha':os.environ['REMOTE_SHA'],'remoteBranchExists':True,'prUrl':os.environ['PR_URL'],'prState':pr.get('state'),'authOwner':'GH_CLI_GIT_CREDENTIAL_HELPER','secretName':'CP32_BOOTSTRAP_PAT','productionSourceMutationCount':0}
          open('artifacts/bootstrap/r8-remote-install-status.json','w').write(json.dumps(rec,indent=2)+'\n')
          PYSTATUS

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          {
            echo '## CP32 External Player-Path Harness R8'
            echo
            echo "Trusted SHA: $CP32_EXPECTED_SHA256"
            echo 'Production source mutation count: 0'
            echo 'Target branch: cp32-player-path-harness-ownership-r1'
            [[ -f artifacts/bootstrap/r8-remote-install-status.json ]] && cat artifacts/bootstrap/r8-remote-install-status.json
            echo 'After merging the generated PR, run CP32 Trusted Candidate E2E on branch main.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure bootstrap evidence root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          [[ -f artifacts/bootstrap/run-context.txt ]] || printf '%s\n' 'bootstrap_evidence_root_recovered=true' "run_id=$GITHUB_RUN_ID" > artifacts/bootstrap/run-context-recovered.txt

      - name: Upload R8 correction evidence and fallback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-player-path-harness-r8-${{ github.run_id }}
          path: artifacts/bootstrap/
          if-no-files-found: error
          include-hidden-files: true
