          CasaNwac44KUoK1NRPHD/XkE5Ecwjkh445vc+dvln7pJBTpIhD6Rsd4VziYs9CgX4I77wDkPIKJr
          J+yuuHErDn7qd9pQfvrEnZLJPO8fuIFtH1QKhTtThOE8Ltx+OtVbehXJLBNwrS9ngPZdzO4sJiqq
          90rh7q6QW1EeXVznF3+UYtM5tuJXPlKTotcAYSda+u59bvcmz36vG+pfds90q0lkt1Wz26rZbdWs
          0fR3bjQlOxBZrykb2chGNrKRjWxkIxvZyEY2spGNTxr/BaPh7vgAUAAA
          CP32_R6_PAYLOAD
          base64 -d "$RUNNER_TEMP/cp32-r6-correction.b64" > "$RUNNER_TEMP/cp32-r6-correction.tar.gz"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/cp32-r6-correction.tar.gz" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c%s "$RUNNER_TEMP/cp32-r6-correction.tar.gz")"
          printf '{"expectedSha256":"%s","actualSha256":"%s","expectedSize":%s,"actualSize":%s}\n'             "$CP32_CORRECTION_PAYLOAD_SHA256" "$ACTUAL_SHA" "$CP32_CORRECTION_PAYLOAD_SIZE" "$ACTUAL_SIZE"             > artifacts/bootstrap/correction-payload-identity.json
          [[ "$ACTUAL_SHA" == "$CP32_CORRECTION_PAYLOAD_SHA256" && "$ACTUAL_SIZE" == "$CP32_CORRECTION_PAYLOAD_SIZE" ]] || { echo 'R6_CORRECTION_PAYLOAD_IDENTITY_MISMATCH' >&2; exit 2; }
          tar -xzf "$RUNNER_TEMP/cp32-r6-correction.tar.gz" -C "$RUNNER_TEMP/cp32-r6-correction"
          echo "CP32_R6_STAGE=$RUNNER_TEMP/cp32-r6-correction" >> "$GITHUB_ENV"

      - name: Create bounded correction branch and apply only validation workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cp32-validation-installer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c cp32-validation-artifact-lifecycle-r1-local
          cp "$CP32_R6_STAGE/.github/workflows/cp32-trusted-candidate-e2e.yml" .github/workflows/cp32-trusted-candidate-e2e.yml
          cp "$CP32_R6_STAGE/.github/workflows/cp32-android-background-e2e.yml" .github/workflows/cp32-android-background-e2e.yml
          cp "$CP32_R6_STAGE/.github/workflows/cp32-production-e2e.yml" .github/workflows/cp32-production-e2e.yml
          git diff -- .github/workflows/cp32-trusted-candidate-e2e.yml .github/workflows/cp32-android-background-e2e.yml .github/workflows/cp32-production-e2e.yml > artifacts/bootstrap/r6-workflow-correction.diff
          python3 - <<'PYDIFF'
          import json, subprocess
          from pathlib import Path
          expected={
            '.github/workflows/cp32-trusted-candidate-e2e.yml',
            '.github/workflows/cp32-android-background-e2e.yml',
            '.github/workflows/cp32-production-e2e.yml',
          }
          changed=set(filter(None,subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()))
          rec={'expectedChanged':sorted(expected),'actualChanged':sorted(changed),'onlyBoundedValidationFiles':changed==expected}
          Path('artifacts/bootstrap/source-mutation-boundary.json').write_text(json.dumps(rec,indent=2)+'\n')
          if changed != expected: raise SystemExit('R6_SOURCE_MUTATION_BOUNDARY_VIOLATION')
          PYDIFF

      - name: Static artifact lifecycle audit
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; ARGV.each { |f| YAML.load_file(f); puts 'YAML_OK '+f }"             .github/workflows/cp32-trusted-candidate-e2e.yml             .github/workflows/cp32-android-background-e2e.yml             .github/workflows/cp32-production-e2e.yml             > artifacts/bootstrap/r6-workflow-yaml-parse.log
          python3 - <<'PYLIFECYCLE'
          import json, re
          from pathlib import Path

          wf_paths=[
            Path('.github/workflows/cp32-trusted-candidate-e2e.yml'),
            Path('.github/workflows/cp32-android-background-e2e.yml'),
            Path('.github/workflows/cp32-production-e2e.yml'),
          ]
          direct_targets={
            'cp32-trusted-candidate-e2e.yml':[
              'artifacts/preflight/resolved-package-lock.sha256','artifacts/preflight/key.pem','artifacts/preflight/cert.pem',
              'artifacts/preflight/candidate-server.stdout.log','artifacts/preflight/candidate-server.stderr.log','artifacts/preflight/candidate-server.pid'],
            'cp32-android-background-e2e.yml':[
              'artifacts/preflight/key.pem','artifacts/preflight/cert.pem','artifacts/preflight/candidate-server.stdout.log',
              'artifacts/preflight/candidate-server.stderr.log','artifacts/preflight/candidate-server.pid','artifacts/android/logcat.txt'],
            'cp32-production-e2e.yml':['artifacts/preflight/production-preflight.json'],
          }
          rows=[]; write_before_init=[]
          for p in wf_paths:
            lines=p.read_text().splitlines()
            init_line=next((i+1 for i,l in enumerate(lines) if 'name: Initialize validation evidence filesystem' in l),None)
            final_line=next((i+1 for i,l in enumerate(lines) if 'name: Finalize evidence lifecycle' in l),None)
            upload_line=next((i+1 for i,l in enumerate(lines) if 'uses: actions/upload-artifact@' in l),None)
            for target in direct_targets[p.name]:
              hit=next((i+1 for i,l in enumerate(lines) if target in l),None)
              row={'workflow':str(p),'writerTarget':target,'writerLine':hit,'initLine':init_line,'initBeforeWrite':bool(init_line and hit and init_line<hit),'uploadLine':upload_line,'finalizerBeforeUpload':bool(final_line and upload_line and final_line<upload_line)}
              rows.append(row)
              if not row['initBeforeWrite']: write_before_init.append(row)
            if not final_line or not upload_line or final_line>=upload_line:
              write_before_init.append({'workflow':str(p),'error':'FINALIZER_NOT_BEFORE_UPLOAD'})

          roots=[Path('.github/workflows'),Path('tests'),Path('tools'),Path('playwright.config.js'),Path('package.json')]
          inventory=[]
          for root in roots:
            files=[root] if root.is_file() else [x for x in root.rglob('*') if x.is_file()]
            for f in files:
              try: text=f.read_text(errors='ignore')
              except Exception: continue
              for i,line in enumerate(text.splitlines(),1):
                if 'artifacts/' in line:
                  inventory.append({'file':str(f),'line':i,'text':line.strip()[:300]})
          out={'classification':'VALIDATION_ARTIFACT_TREE_INITIALIZATION_MISSING_CORRECTED','directWriterLedger':rows,'artifactReferenceInventory':inventory,'artifactReferenceCount':len(inventory),'ARTIFACT_WRITE_BEFORE_INIT':len(write_before_init),'violations':write_before_init}
          Path('artifacts/bootstrap/artifact-writer-inventory.json').write_text(json.dumps(out,indent=2)+'\n')
          if write_before_init: raise SystemExit('ARTIFACT_WRITE_BEFORE_INIT_NONZERO')
          PYLIFECYCLE

      - name: Verify trusted HTML remains byte-identical and package fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSOURCE'
          import hashlib, json, os
          from pathlib import Path
          candidates=[
            Path('trusted/CP32_ACTIVE_WRAPPER_CUTOVER_TRUSTED_BASELINE_20260805T2220KST.html'),
            Path('validation/bootstrap/CP32_TRUSTED_CANDIDATE.html'),
            Path('validation/bootstrap/MOBILE_UPLOAD_02_CP32_TRUSTED_CANDIDATE.html'),
          ]
          rows=[]; ok=False
          for p in candidates:
            if p.is_file():
              b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest(); exact=sha==os.environ['CP32_EXPECTED_SHA256'] and len(b)==int(os.environ['CP32_EXPECTED_SIZE'])
              rows.append({'path':str(p),'sha256':sha,'size':len(b),'exact':exact}); ok=ok or exact
          Path('artifacts/bootstrap/trusted-source-preservation.json').write_text(json.dumps({'productionSourceMutationCount':0,'trustedCandidates':rows,'trustedShaUnchanged':ok},indent=2)+'\n')
          if not ok: raise SystemExit('TRUSTED_HTML_MUTATION_DETECTED')
          PYSOURCE
          FALLBACK="$GITHUB_WORKSPACE/artifacts/bootstrap/cp32-validation-artifact-lifecycle-r6-ready.zip"
          (cd "$CP32_R6_STAGE" && zip -qr "$FALLBACK" .github/workflows)
          sha256sum "$FALLBACK" > "$FALLBACK.sha256"

      - name: Commit bounded correction locally
        id: localcommit
        shell: bash
        run: |
          set -euo pipefail
          git add             .github/workflows/cp32-trusted-candidate-e2e.yml             .github/workflows/cp32-android-background-e2e.yml             .github/workflows/cp32-production-e2e.yml
          git diff --cached --check
          git commit -m 'Correct CP32 validation artifact lifecycle'
          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "local_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$LOCAL_SHA" > artifacts/bootstrap/local-commit-sha.txt

      - name: Authenticate, push correction branch, verify remote, and create PR
        id: remote
        shell: bash
        env:
          CP32_BOOTSTRAP_PAT: ${{ secrets.CP32_BOOTSTRAP_PAT }}
        run: |
          set -euo pipefail
          STATUS_FILE="$GITHUB_WORKSPACE/artifacts/bootstrap/remote-install-status.json"
          BASE="${{ github.event.repository.default_branch }}"
          BRANCH='cp32-validation-artifact-lifecycle-r1'
          LOCAL_SHA='${{ steps.localcommit.outputs.local_sha }}'
          GIT_AUTH_CONFIG="$RUNNER_TEMP/cp32-r6-gitconfig"
          API_IDENTITY_AUTH='NOT_RUN'; API_REPOSITORY_ACCESS='NOT_RUN'; GIT_HTTPS_READ_AUTH='NOT_RUN'; GIT_HTTPS_WRITE_AUTH='NOT_RUN'
          REMOTE_SHA=''; PR_URL=''; PR_STATE=''; PUSH_RC=99; PR_RC=99

          write_status() {
            python3 - "$STATUS_FILE" "$1" "$BRANCH" "$BASE" "$LOCAL_SHA" "$REMOTE_SHA" "$PR_URL" "$PR_STATE" "$PUSH_RC" "$PR_RC" "$API_IDENTITY_AUTH" "$API_REPOSITORY_ACCESS" "$GIT_HTTPS_READ_AUTH" "$GIT_HTTPS_WRITE_AUTH" <<'PYSTATUS'
          import json,sys
          path,status,branch,base,local_sha,remote_sha,pr_url,pr_state,push_rc,pr_rc,api_id,api_repo,git_read,git_write=sys.argv[1:]
          open(path,'w').write(json.dumps({'status':status,'branch':branch,'base':base,'localCommitSha':local_sha,'remoteCommitSha':remote_sha,'remoteBranchExists':bool(remote_sha),'prUrl':pr_url,'prState':pr_state,'pushExitCode':int(push_rc),'prExitCode':int(pr_rc),'authOwner':'GH_CLI_GIT_CREDENTIAL_HELPER','secretName':'CP32_BOOTSTRAP_PAT','API_IDENTITY_AUTH':api_id,'API_REPOSITORY_ACCESS':api_repo,'GIT_HTTPS_READ_AUTH':git_read,'GIT_HTTPS_WRITE_AUTH':git_write,'tokenMaterialRecorded':False},indent=2)+'\n')
          PYSTATUS
          }
          cleanup() { set +e; unset GH_TOKEN CP32_BOOTSTRAP_PAT GIT_CONFIG_GLOBAL; rm -f "$GIT_AUTH_CONFIG"; set -e; }
          trap cleanup EXIT

          if [[ -z "${CP32_BOOTSTRAP_PAT:-}" ]]; then
            write_status 'CP32_BOOTSTRAP_PAT_REQUIRED_FOR_WORKFLOW_FILE_INSTALL'; exit 21
          fi
          export GH_TOKEN="$CP32_BOOTSTRAP_PAT"
          export GIT_CONFIG_GLOBAL="$GIT_AUTH_CONFIG"
          : > "$GIT_AUTH_CONFIG"; chmod 600 "$GIT_AUTH_CONFIG"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          LOGIN="$(gh api user --jq '.login' 2> artifacts/bootstrap/api-identity.stderr.log)" || { API_IDENTITY_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_PAT_AUTH_FAILED'; exit 22; }
          [[ -n "$LOGIN" ]] || { API_IDENTITY_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_PAT_AUTH_FAILED'; exit 22; }
          API_IDENTITY_AUTH='PASS'
          gh api "repos/$GITHUB_REPOSITORY" --jq '{fullName:.full_name,defaultBranch:.default_branch,visibility:.visibility,permissions:.permissions}' > artifacts/bootstrap/api-repository-access.json 2> artifacts/bootstrap/api-repository-access.stderr.log || { API_REPOSITORY_ACCESS='FAIL'; write_status 'CP32_BOOTSTRAP_PAT_REPOSITORY_ACCESS_FAILED'; exit 26; }
          API_REPOSITORY_ACCESS='PASS'
          gh auth setup-git --hostname github.com --force > artifacts/bootstrap/gh-auth-setup-git.stdout.log 2> artifacts/bootstrap/gh-auth-setup-git.stderr.log || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_GIT_CREDENTIAL_SETUP_FAILED'; exit 27; }

          BASE_LINE="$(git ls-remote origin "refs/heads/$BASE" 2> artifacts/bootstrap/git-read.stderr.log)" || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED'; exit 28; }
          [[ -n "$BASE_LINE" ]] || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_BASE_REF_NOT_OBSERVED'; exit 29; }
          GIT_HTTPS_READ_AUTH='PASS'

          EXISTING="$(git ls-remote origin "refs/heads/$BRANCH" 2> artifacts/bootstrap/branch-check.stderr.log)" || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED'; exit 28; }
          if [[ -n "$EXISTING" ]]; then BRANCH="cp32-validation-artifact-lifecycle-r1-$GITHUB_RUN_ID"; fi
          git branch -m "$BRANCH"

          set +e
          git push -u origin "$BRANCH" > artifacts/bootstrap/git-push.stdout.log 2> artifacts/bootstrap/git-push.stderr.log
          PUSH_RC=$?
          set -e
          if [[ $PUSH_RC -ne 0 ]]; then GIT_HTTPS_WRITE_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_REMOTE_PUSH_FAILED'; exit 23; fi
          GIT_HTTPS_WRITE_AUTH='PASS'

          REMOTE_LINE="$(git ls-remote origin "refs/heads/$BRANCH" 2> artifacts/bootstrap/remote-branch-check.stderr.log)" || { write_status 'CP32_BOOTSTRAP_REMOTE_BRANCH_OBSERVATION_TRANSPORT_FAILED'; exit 30; }
          REMOTE_SHA="${REMOTE_LINE%%[[:space:]]*}"
          [[ -n "$REMOTE_SHA" ]] || { write_status 'CP32_BOOTSTRAP_REMOTE_BRANCH_NOT_OBSERVED'; exit 31; }
          [[ "$REMOTE_SHA" == "$LOCAL_SHA" ]] || { write_status 'CP32_BOOTSTRAP_REMOTE_SHA_MISMATCH'; exit 32; }

          set +e
          PR_URL="$(gh pr create --base "$BASE" --head "$BRANCH" --title 'Correct CP32 validation artifact lifecycle' --body 'Bounded infrastructure correction: initializes validation evidence trees before writes, validates required evidence on successful runs, and preserves upload evidence on early failures. Trusted game HTML and production source are unchanged.' 2> artifacts/bootstrap/pr-create.stderr.log)"
          PR_RC=$?
          set -e
          if [[ $PR_RC -ne 0 || -z "$PR_URL" ]]; then write_status 'CP32_BOOTSTRAP_PR_CREATE_FAILED'; exit 24; fi
          PR_JSON="$(gh pr view "$PR_URL" --json headRefName,baseRefName,state,url 2> artifacts/bootstrap/pr-view.stderr.log)" || { write_status 'CP32_BOOTSTRAP_PR_VERIFICATION_FAILED'; exit 25; }
          printf '%s\n' "$PR_JSON" > artifacts/bootstrap/pr-verification.json
          export PR_JSON BRANCH BASE
          PR_STATE="$(python3 - <<'PYPR'
          import json,os
          r=json.loads(os.environ['PR_JSON'])
          ok=r.get('headRefName')==os.environ['BRANCH'] and r.get('baseRefName')==os.environ['BASE'] and r.get('state')=='OPEN' and bool(r.get('url'))
          if not ok: raise SystemExit('PR_VERIFICATION_MISMATCH')
          print(r.get('state',''))
          PYPR
          )"
          write_status 'CP32_VALIDATION_ARTIFACT_LIFECYCLE_R6_PR_READY'
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          {
            echo '## CP32 Validation Artifact Lifecycle R6'
            echo
            echo "Trusted SHA: $CP32_EXPECTED_SHA256"
            echo 'Production source mutation count: 0'
            [[ -f artifacts/bootstrap/remote-install-status.json ]] && cat artifacts/bootstrap/remote-install-status.json
            echo
            echo 'After merging the generated PR, run CP32 Trusted Candidate E2E on branch main.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure bootstrap evidence root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          if [[ ! -f artifacts/bootstrap/run-context.txt ]]; then
            printf '%s\n' 'bootstrap_evidence_root_recovered=true' "run_id=$GITHUB_RUN_ID" > artifacts/bootstrap/run-context-recovered.txt
          fi

      - name: Upload R6 correction evidence and fallback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-validation-artifact-lifecycle-r6-${{ github.run_id }}
          path: artifacts/bootstrap/
          if-no-files-found: error
          include-hidden-files: true

