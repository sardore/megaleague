name: CP32 Bootstrap Install

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: cp32-validation-local-tls-r7
  cancel-in-progress: false

env:
  CP32_EXPECTED_SHA256: fbbdad911cb6c90a95aaedb9cf66820f41dc2a323e90088a3cb5ee4d407b22a8
  CP32_EXPECTED_SIZE: '7372055'
  CP32_EXPECTED_BUILD: CP32-ACTIVE-WRAPPER-CUTOVER-R1-20260805T2220KST
  CP32_CORRECTION_PAYLOAD_SHA256: 42e33259f6537c93f9262e6a2296fcdc82d484b881b61be63556a9d64509b374
  CP32_CORRECTION_PAYLOAD_SIZE: '12258'
  CP32_PARENT_CANDIDATE_WORKFLOW_SHA256: 970ea9c5cdca5136422e4aedf068fdc48e1410fdca7adea72b3100caeb31620f
  CP32_PARENT_ANDROID_WORKFLOW_SHA256_A: 26a12a7fc75b5127ecf2015b820f58d4a607c780a51d278b1f74393fa77802e9
  CP32_PARENT_ANDROID_WORKFLOW_SHA256_B: bd864f6fde19aab40118137e31e7cffc0ff336abfe8c327ceb6b4ed8909eeeed
  CP32_PARENT_PRODUCTION_WORKFLOW_SHA256_A: a7545e3f33081235799c626fb2267083eee1cac3f98989452437ab9488815e86
  CP32_PARENT_PRODUCTION_WORKFLOW_SHA256_B: f88680d8545270fc3091f7b03f0bd5d029a9f343d216b89b194d0bdf97065121
  CP32_PARENT_RELAY_PREFLIGHT_SHA256: a51e53140fc2d16ce7ba61760dd6bca987c2e32911997d28015fcd0fd43e7717
  CP32_PARENT_TWO_CLIENTS_SHA256: 6dac45675b3febd7df38142564e69ecdf6db9c8c596160e39594e962cf5a3d59
  CP32_PARENT_ANDROID_DRIVER_SHA256: e7b4c3c0ce2d6c630cb1e3c2e02db2937e6cf2492e3d4d7ae3853b1434d35cfe
  CP32_PARENT_PLAYWRIGHT_SHA256: 7bfc4c1d2b5283c7773f1d929dfd18c4371a7ddc90330ec882992931904cb85f
  CP32_PARENT_STATIC_VALIDATION_SHA256: 0739ea4b343dfd42d9a6963c20cd133fd7fb5e9ed71e29663ca530c028a7f6cc

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Initialize bootstrap evidence root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "repository=$GITHUB_REPOSITORY" "source_sha=$GITHUB_SHA" > artifacts/bootstrap/run-context.txt

      - name: Verify trusted source and R7 parent infrastructure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPARENT'
          import hashlib,json,os
          from pathlib import Path
          expected_sha=os.environ['CP32_EXPECTED_SHA256']; expected_size=int(os.environ['CP32_EXPECTED_SIZE']); expected_build=os.environ['CP32_EXPECTED_BUILD'].encode()
          html_candidates=[Path('trusted/CP32_ACTIVE_WRAPPER_CUTOVER_TRUSTED_BASELINE_20260805T2220KST.html'),Path('validation/bootstrap/CP32_TRUSTED_CANDIDATE.html'),Path('validation/bootstrap/MOBILE_UPLOAD_02_CP32_TRUSTED_CANDIDATE.html')]
          html=[]; trusted_ok=False
          for p in html_candidates:
            if not p.is_file(): html.append({'path':str(p),'exists':False}); continue
            b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest(); exact=sha==expected_sha and len(b)==expected_size and expected_build in b
            html.append({'path':str(p),'exists':True,'size':len(b),'sha256':sha,'buildPresent':expected_build in b,'exact':exact}); trusted_ok=trusted_ok or exact
          expected={
            '.github/workflows/cp32-trusted-candidate-e2e.yml':{os.environ['CP32_PARENT_CANDIDATE_WORKFLOW_SHA256']},
            '.github/workflows/cp32-android-background-e2e.yml':{os.environ['CP32_PARENT_ANDROID_WORKFLOW_SHA256_A'],os.environ['CP32_PARENT_ANDROID_WORKFLOW_SHA256_B']},
            '.github/workflows/cp32-production-e2e.yml':{os.environ['CP32_PARENT_PRODUCTION_WORKFLOW_SHA256_A'],os.environ['CP32_PARENT_PRODUCTION_WORKFLOW_SHA256_B']},
            'tests/helpers/relay-preflight.js':{os.environ['CP32_PARENT_RELAY_PREFLIGHT_SHA256']},
            'tests/helpers/two-independent-clients.js':{os.environ['CP32_PARENT_TWO_CLIENTS_SHA256']},
            'tests/android/android-background-player-path.js':{os.environ['CP32_PARENT_ANDROID_DRIVER_SHA256']},
            'playwright.config.js':{os.environ['CP32_PARENT_PLAYWRIGHT_SHA256']},
            'tools/static-validation.js':{os.environ['CP32_PARENT_STATIC_VALIDATION_SHA256']},
          }
          rows=[]; parent_ok=True
          for name,allowed in expected.items():
            p=Path(name)
            if not p.is_file(): rows.append({'path':name,'exists':False,'allowedSha256':sorted(allowed)}); parent_ok=False; continue
            sha=hashlib.sha256(p.read_bytes()).hexdigest(); ok=sha in allowed
            rows.append({'path':name,'exists':True,'sha256':sha,'allowedSha256':sorted(allowed),'exactKnownParent':ok}); parent_ok=parent_ok and ok
          out={'trustedHtml':html,'trustedHtmlExactObserved':trusted_ok,'parentInfrastructure':rows,'parentInfrastructurePass':parent_ok,'productionSourceMutationCount':0}
          Path('artifacts/bootstrap/r7-parent-authority.json').write_text(json.dumps(out,indent=2)+'\n')
          if not trusted_ok: raise SystemExit('TRUSTED_HTML_IDENTITY_MISMATCH')
          if not parent_ok: raise SystemExit('R7_PARENT_INFRASTRUCTURE_IDENTITY_MISMATCH')
          PYPARENT

      - name: Stage R7 payload part 1
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cp32-r7-correction.b64" <<'CP32_R7_PAYLOAD_1'
          
          CP32_R7_PAYLOAD_1

      - name: Stage R7 payload part 2
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/cp32-r7-correction.b64" <<'CP32_R7_PAYLOAD_2'
          
          CP32_R7_PAYLOAD_2

      - name: Stage R7 payload part 3
        shell: bash
        run: |
          set -euo pipefail
          cat >> "$RUNNER_TEMP/cp32-r7-correction.b64" <<'CP32_R7_PAYLOAD_3'
          
          CP32_R7_PAYLOAD_3

      - name: Decode exact R7 correction payload
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cp32-r7-correction"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          base64 -d "$RUNNER_TEMP/cp32-r7-correction.b64" > "$RUNNER_TEMP/cp32-r7-correction.tar.gz"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/cp32-r7-correction.tar.gz" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c%s "$RUNNER_TEMP/cp32-r7-correction.tar.gz")"
          printf '{"expectedSha256":"%s","actualSha256":"%s","expectedSize":%s,"actualSize":%s}\n' "$CP32_CORRECTION_PAYLOAD_SHA256" "$ACTUAL_SHA" "$CP32_CORRECTION_PAYLOAD_SIZE" "$ACTUAL_SIZE" > artifacts/bootstrap/r7-payload-identity.json
          [[ "$ACTUAL_SHA" == "$CP32_CORRECTION_PAYLOAD_SHA256" && "$ACTUAL_SIZE" == "$CP32_CORRECTION_PAYLOAD_SIZE" ]] || { echo 'R7_CORRECTION_PAYLOAD_IDENTITY_MISMATCH' >&2; exit 2; }
          tar -xzf "$RUNNER_TEMP/cp32-r7-correction.tar.gz" -C "$STAGE"
          echo "CP32_R7_STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Create bounded R7 branch and apply validation infrastructure only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'cp32-validation-installer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "cp32-validation-local-tls-r1-local-$GITHUB_RUN_ID"
          allowed=(
            .github/workflows/cp32-trusted-candidate-e2e.yml
            .github/workflows/cp32-android-background-e2e.yml
            .github/workflows/cp32-production-e2e.yml
            tests/helpers/relay-preflight.js
            tests/helpers/local-candidate-tls.js
            tests/helpers/two-independent-clients.js
            tests/android/android-background-player-path.js
            tools/static-validation.js
            tools/tls-trust-regression.js
            playwright.config.js
          )
          for f in "${allowed[@]}"; do mkdir -p "$(dirname "$f")"; cp "$CP32_R7_STAGE/$f" "$f"; done
          { git diff --name-only; git ls-files --others --exclude-standard | sed '/^artifacts\//d'; } | sort -u > artifacts/bootstrap/r7-changed-files.txt
          python3 - <<'PYBOUND'
          from pathlib import Path
          allowed={'.github/workflows/cp32-trusted-candidate-e2e.yml','.github/workflows/cp32-android-background-e2e.yml','.github/workflows/cp32-production-e2e.yml','tests/helpers/relay-preflight.js','tests/helpers/local-candidate-tls.js','tests/helpers/two-independent-clients.js','tests/android/android-background-player-path.js','tools/static-validation.js','tools/tls-trust-regression.js','playwright.config.js'}
          changed={x.strip() for x in Path('artifacts/bootstrap/r7-changed-files.txt').read_text().splitlines() if x.strip()}
          extra=sorted(changed-allowed)
          if extra: raise SystemExit('R7_UNBOUNDED_FILE_MUTATION:'+','.join(extra))
          if 'index.html' in changed or any(x.endswith('.html') for x in changed): raise SystemExit('PRODUCTION_HTML_MUTATION_FORBIDDEN')
          PYBOUND

      - name: R7 static, lifecycle, and TLS policy validation
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; ARGV.each { |f| YAML.load_file(f); puts 'YAML_OK '+f }" .github/workflows/cp32-trusted-candidate-e2e.yml .github/workflows/cp32-android-background-e2e.yml .github/workflows/cp32-production-e2e.yml > artifacts/bootstrap/r7-workflow-yaml-parse.log
          for f in tests/helpers/relay-preflight.js tests/helpers/local-candidate-tls.js tests/helpers/two-independent-clients.js tests/android/android-background-player-path.js tools/static-validation.js tools/tls-trust-regression.js playwright.config.js; do node --check "$f"; done > artifacts/bootstrap/r7-node-parse.log 2>&1
          node tools/static-validation.js > artifacts/bootstrap/r7-static-validation.stdout.log 2> artifacts/bootstrap/r7-static-validation.stderr.log
          cp artifacts/results/static-validation.json artifacts/bootstrap/r7-static-validation.json
          python3 - <<'PYR7AUDIT'
          import json,re
          from pathlib import Path
          workflows=[Path('.github/workflows/cp32-trusted-candidate-e2e.yml'),Path('.github/workflows/cp32-android-background-e2e.yml'),Path('.github/workflows/cp32-production-e2e.yml')]
          lifecycle=[]; violations=[]
          targets={
            'cp32-trusted-candidate-e2e.yml':['artifacts/preflight/resolved-package-lock.sha256','artifacts/preflight/key.pem','artifacts/preflight/cert.pem','artifacts/preflight/candidate-server.stdout.log','artifacts/preflight/preflight.json'],
            'cp32-android-background-e2e.yml':['artifacts/preflight/key.pem','artifacts/preflight/cert.pem','artifacts/preflight/candidate-server.stdout.log','artifacts/preflight/android-preflight.json','artifacts/android/logcat.txt'],
            'cp32-production-e2e.yml':['artifacts/preflight/production-preflight.json'],
          }
          for p in workflows:
            lines=p.read_text().splitlines(); init=next((i+1 for i,l in enumerate(lines) if 'Initialize validation evidence filesystem' in l),None)
            for t in targets[p.name]:
              hit=next((i+1 for i,l in enumerate(lines) if t in l),None); ok=bool(init and hit and init<hit); row={'workflow':str(p),'target':t,'initLine':init,'firstReferenceLine':hit,'initBeforeReference':ok}; lifecycle.append(row)
              if not ok: violations.append(row)
          files=[p for root in [Path('tests'),Path('tools')] for p in root.rglob('*.js')]+[Path('playwright.config.js')]
          text='\n'.join(p.read_text(errors='ignore') for p in files)
          security={
            'NODE_TLS_REJECT_UNAUTHORIZED_ZERO': bool(re.search(r'(?:process\.)?env\.NODE_TLS_REJECT_UNAUTHORIZED\s*=\s*["\']0["\']',text)),
            'GENERIC_REJECT_UNAUTHORIZED_FALSE': bool(re.search(r'rejectUnauthorized\s*:\s*false',text)),
            'BARE_IGNORE_CERTIFICATE_ERRORS': bool(re.search(r'(?:^|[\s"\'])--ignore-certificate-errors(?:[\s"\']|$)',text,re.M)),
            'PLAYWRIGHT_IGNORE_HTTPS_TRUE': bool(re.search(r'ignoreHTTPSErrors\s*:\s*true',Path('playwright.config.js').read_text())),
            'SCOPED_SPKI_PRESENT': '--ignore-certificate-errors-spki-list=' in text,
            'LOCAL_TLS_OWNER_PRESENT': Path('tests/helpers/local-candidate-tls.js').is_file(),
          }
          out={'ARTIFACT_WRITE_BEFORE_INIT':len(violations),'lifecycle':lifecycle,'LOCAL_CANDIDATE_TLS_POLICY_DIVERGENCE':0 if security['SCOPED_SPKI_PRESENT'] and security['LOCAL_TLS_OWNER_PRESENT'] and not any(security[k] for k in ['NODE_TLS_REJECT_UNAUTHORIZED_ZERO','GENERIC_REJECT_UNAUTHORIZED_FALSE','BARE_IGNORE_CERTIFICATE_ERRORS','PLAYWRIGHT_IGNORE_HTTPS_TRUE']) else 1,'security':security}
          Path('artifacts/bootstrap/r7-infrastructure-audit.json').write_text(json.dumps(out,indent=2)+'\n')
          if violations or out['LOCAL_CANDIDATE_TLS_POLICY_DIVERGENCE']!=0: raise SystemExit('R7_INFRASTRUCTURE_INVARIANT_FAILED')
          PYR7AUDIT

      - name: R7 local scoped TLS regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap/r7-local-tls artifacts/preflight
          openssl req -x509 -newkey rsa:2048 -nodes -keyout artifacts/preflight/key.pem -out artifacts/preflight/cert.pem -days 1 -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1,IP:10.0.2.2' > artifacts/bootstrap/r7-local-tls/openssl.stdout.log 2> artifacts/bootstrap/r7-local-tls/openssl.stderr.log
          SPKI="$(openssl x509 -in artifacts/preflight/cert.pem -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256 -binary | openssl base64 -A)"
          export CP32_LOCAL_TRUST_CERT="$GITHUB_WORKSPACE/artifacts/preflight/cert.pem"
          export CP32_LOCAL_CERT_SPKI="$SPKI"
          export CP32_CANDIDATE_PORT=9443
          export CP32_CANDIDATE_ORIGIN=https://127.0.0.1:9443
          node tests/helpers/candidate-https-server.js > artifacts/bootstrap/r7-local-tls/server.stdout.log 2> artifacts/bootstrap/r7-local-tls/server.stderr.log &
          SERVER_PID=$!
          cleanup_server(){ set +e; kill "$SERVER_PID" 2>/dev/null; wait "$SERVER_PID" 2>/dev/null; set -e; }
          trap cleanup_server EXIT
          for _ in $(seq 1 50); do [[ -f artifacts/preflight/candidate-server-ready.json ]] && break; sleep .1; done
          CP32_TLS_REGRESSION_OUTPUT=artifacts/bootstrap/r7-local-tls/TLS_TRUST_REGRESSION.json node tools/tls-trust-regression.js
          cleanup_server
          trap - EXIT

      - name: Verify trusted HTML unchanged and package fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYSOURCE'
          import hashlib,json,os
          from pathlib import Path
          candidates=[Path('trusted/CP32_ACTIVE_WRAPPER_CUTOVER_TRUSTED_BASELINE_20260805T2220KST.html'),Path('validation/bootstrap/CP32_TRUSTED_CANDIDATE.html'),Path('validation/bootstrap/MOBILE_UPLOAD_02_CP32_TRUSTED_CANDIDATE.html')]
          rows=[]; ok=False
          for p in candidates:
            if p.is_file():
              b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest(); exact=sha==os.environ['CP32_EXPECTED_SHA256'] and len(b)==int(os.environ['CP32_EXPECTED_SIZE']) and os.environ['CP32_EXPECTED_BUILD'].encode() in b
              rows.append({'path':str(p),'sha256':sha,'size':len(b),'exact':exact}); ok=ok or exact
          Path('artifacts/bootstrap/r7-trusted-source-preservation.json').write_text(json.dumps({'productionSourceMutationCount':0,'indexHtmlMutationCount':0,'relaySourceMutationCount':0,'trustedCandidates':rows,'trustedShaUnchanged':ok},indent=2)+'\n')
          if not ok: raise SystemExit('TRUSTED_HTML_MUTATION_DETECTED')
          PYSOURCE
          FALLBACK="$GITHUB_WORKSPACE/artifacts/bootstrap/cp32-validation-local-tls-r7-ready.zip"
          (cd "$CP32_R7_STAGE" && zip -qr "$FALLBACK" .github tests tools playwright.config.js R7_CORRECTION_MANIFEST.json)
          sha256sum "$FALLBACK" > "$FALLBACK.sha256"

      - name: Commit bounded R7 correction locally
        id: localcommit
        shell: bash
        run: |
          set -euo pipefail
          git add .github/workflows/cp32-trusted-candidate-e2e.yml .github/workflows/cp32-android-background-e2e.yml .github/workflows/cp32-production-e2e.yml tests/helpers/relay-preflight.js tests/helpers/local-candidate-tls.js tests/helpers/two-independent-clients.js tests/android/android-background-player-path.js tools/static-validation.js tools/tls-trust-regression.js playwright.config.js
          git diff --cached --check
          git commit -m 'Correct CP32 local candidate TLS trust policy'
          LOCAL_SHA="$(git rev-parse HEAD)"
          echo "local_sha=$LOCAL_SHA" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$LOCAL_SHA" > artifacts/bootstrap/r7-local-commit-sha.txt

      - name: Authenticate, push R7 correction branch, verify remote, and create PR
        id: remote
        shell: bash
        env:
          CP32_BOOTSTRAP_PAT: ${{ secrets.CP32_BOOTSTRAP_PAT }}
        run: |
          set -euo pipefail
          STATUS_FILE="$GITHUB_WORKSPACE/artifacts/bootstrap/r7-remote-install-status.json"
          BASE="${{ github.event.repository.default_branch }}"
          BRANCH='cp32-validation-local-tls-r1'
          LOCAL_SHA='${{ steps.localcommit.outputs.local_sha }}'
          GIT_AUTH_CONFIG="$RUNNER_TEMP/cp32-r7-gitconfig"
          API_IDENTITY_AUTH='NOT_RUN'; API_REPOSITORY_ACCESS='NOT_RUN'; GIT_HTTPS_READ_AUTH='NOT_RUN'; GIT_HTTPS_WRITE_AUTH='NOT_RUN'; REMOTE_SHA=''; PR_URL=''; PR_STATE=''; PUSH_RC=99; PR_RC=99
          write_status(){ python3 - "$STATUS_FILE" "$1" "$BRANCH" "$BASE" "$LOCAL_SHA" "$REMOTE_SHA" "$PR_URL" "$PR_STATE" "$PUSH_RC" "$PR_RC" "$API_IDENTITY_AUTH" "$API_REPOSITORY_ACCESS" "$GIT_HTTPS_READ_AUTH" "$GIT_HTTPS_WRITE_AUTH" <<'PYSTATUS'
          import json,sys
          path,status,branch,base,local_sha,remote_sha,pr_url,pr_state,push_rc,pr_rc,api_id,api_repo,git_read,git_write=sys.argv[1:]
          open(path,'w').write(json.dumps({'status':status,'branch':branch,'base':base,'localCommitSha':local_sha,'remoteCommitSha':remote_sha,'remoteBranchExists':bool(remote_sha),'prUrl':pr_url,'prState':pr_state,'pushExitCode':int(push_rc),'prExitCode':int(pr_rc),'authOwner':'GH_CLI_GIT_CREDENTIAL_HELPER','secretName':'CP32_BOOTSTRAP_PAT','API_IDENTITY_AUTH':api_id,'API_REPOSITORY_ACCESS':api_repo,'GIT_HTTPS_READ_AUTH':git_read,'GIT_HTTPS_WRITE_AUTH':git_write,'tokenMaterialRecorded':False},indent=2)+'\n')
          PYSTATUS
          }
          cleanup(){ set +e; unset GH_TOKEN CP32_BOOTSTRAP_PAT GIT_CONFIG_GLOBAL; rm -f "$GIT_AUTH_CONFIG"; set -e; }
          trap cleanup EXIT
          if [[ -z "${CP32_BOOTSTRAP_PAT:-}" ]]; then write_status 'CP32_BOOTSTRAP_PAT_REQUIRED_FOR_WORKFLOW_FILE_INSTALL'; exit 21; fi
          export GH_TOKEN="$CP32_BOOTSTRAP_PAT"; export GIT_CONFIG_GLOBAL="$GIT_AUTH_CONFIG"; : > "$GIT_AUTH_CONFIG"; chmod 600 "$GIT_AUTH_CONFIG"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          LOGIN="$(gh api user --jq '.login' 2> artifacts/bootstrap/r7-api-identity.stderr.log)" || { API_IDENTITY_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_PAT_AUTH_FAILED'; exit 22; }
          [[ -n "$LOGIN" ]] || { API_IDENTITY_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_PAT_AUTH_FAILED'; exit 22; }; API_IDENTITY_AUTH='PASS'
          gh api "repos/$GITHUB_REPOSITORY" --jq '{fullName:.full_name,defaultBranch:.default_branch,visibility:.visibility,permissions:.permissions}' > artifacts/bootstrap/r7-api-repository-access.json 2> artifacts/bootstrap/r7-api-repository-access.stderr.log || { API_REPOSITORY_ACCESS='FAIL'; write_status 'CP32_BOOTSTRAP_PAT_REPOSITORY_ACCESS_FAILED'; exit 26; }; API_REPOSITORY_ACCESS='PASS'
          gh auth setup-git --hostname github.com --force > artifacts/bootstrap/r7-gh-auth-setup-git.stdout.log 2> artifacts/bootstrap/r7-gh-auth-setup-git.stderr.log || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_GIT_CREDENTIAL_SETUP_FAILED'; exit 27; }
          BASE_LINE="$(git ls-remote origin "refs/heads/$BASE" 2> artifacts/bootstrap/r7-git-read.stderr.log)" || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED'; exit 28; }
          [[ -n "$BASE_LINE" ]] || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_BASE_REF_NOT_OBSERVED'; exit 29; }; GIT_HTTPS_READ_AUTH='PASS'
          EXISTING="$(git ls-remote origin "refs/heads/$BRANCH" 2> artifacts/bootstrap/r7-branch-check.stderr.log)" || { GIT_HTTPS_READ_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED'; exit 28; }
          if [[ -n "$EXISTING" ]]; then BRANCH="cp32-validation-local-tls-r1-$GITHUB_RUN_ID"; fi
          git branch -m "$BRANCH"
          set +e; git push -u origin "$BRANCH" > artifacts/bootstrap/r7-git-push.stdout.log 2> artifacts/bootstrap/r7-git-push.stderr.log; PUSH_RC=$?; set -e
          if [[ $PUSH_RC -ne 0 ]]; then GIT_HTTPS_WRITE_AUTH='FAIL'; write_status 'CP32_BOOTSTRAP_REMOTE_PUSH_FAILED'; exit 23; fi; GIT_HTTPS_WRITE_AUTH='PASS'
          REMOTE_LINE="$(git ls-remote origin "refs/heads/$BRANCH" 2> artifacts/bootstrap/r7-remote-branch-check.stderr.log)" || { write_status 'CP32_BOOTSTRAP_REMOTE_BRANCH_OBSERVATION_TRANSPORT_FAILED'; exit 30; }
          REMOTE_SHA="${REMOTE_LINE%%[[:space:]]*}"; [[ -n "$REMOTE_SHA" ]] || { write_status 'CP32_BOOTSTRAP_REMOTE_BRANCH_NOT_OBSERVED'; exit 31; }; [[ "$REMOTE_SHA" == "$LOCAL_SHA" ]] || { write_status 'CP32_BOOTSTRAP_REMOTE_SHA_MISMATCH'; exit 32; }
          set +e; PR_URL="$(gh pr create --base "$BASE" --head "$BRANCH" --title 'Correct CP32 validation local TLS trust policy' --body 'Bounded validation-infrastructure correction. Local candidate HTTPS trusts only the runtime test certificate/SPKI; production and public relay TLS remain strict. R6 artifact lifecycle is preserved. Trusted game HTML, index.html, and relay source are unchanged.' 2> artifacts/bootstrap/r7-pr-create.stderr.log)"; PR_RC=$?; set -e
          if [[ $PR_RC -ne 0 || -z "$PR_URL" ]]; then write_status 'CP32_BOOTSTRAP_PR_CREATE_FAILED'; exit 24; fi
          PR_JSON="$(gh pr view "$PR_URL" --json headRefName,baseRefName,state,url 2> artifacts/bootstrap/r7-pr-view.stderr.log)" || { write_status 'CP32_BOOTSTRAP_PR_VERIFICATION_FAILED'; exit 25; }
          printf '%s\n' "$PR_JSON" > artifacts/bootstrap/r7-pr-verification.json; export PR_JSON BRANCH BASE
          PR_STATE="$(python3 - <<'PYPR'
          import json,os
          r=json.loads(os.environ['PR_JSON']); ok=r.get('headRefName')==os.environ['BRANCH'] and r.get('baseRefName')==os.environ['BASE'] and r.get('state')=='OPEN' and bool(r.get('url'))
          if not ok: raise SystemExit('PR_VERIFICATION_MISMATCH')
          print(r['state'])
          PYPR
          )"
          write_status 'CP32_VALIDATION_LOCAL_TLS_TRUST_R7_PR_READY'
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"; echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          {
            echo '## CP32 Validation Local TLS Trust R7'
            echo
            echo "Trusted SHA: $CP32_EXPECTED_SHA256"
            echo 'Production source mutation count: 0'
            echo 'Target branch: cp32-validation-local-tls-r1'
            [[ -f artifacts/bootstrap/r7-remote-install-status.json ]] && cat artifacts/bootstrap/r7-remote-install-status.json
            echo
            echo 'After merging the generated PR, run CP32 Trusted Candidate E2E on branch main.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure bootstrap evidence root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          [[ -f artifacts/bootstrap/run-context.txt ]] || printf '%s\n' 'bootstrap_evidence_root_recovered=true' "run_id=$GITHUB_RUN_ID" > artifacts/bootstrap/run-context-recovered.txt

      - name: Upload R7 correction evidence and fallback
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-validation-local-tls-r7-${{ github.run_id }}
          path: artifacts/bootstrap/
          if-no-files-found: error
          include-hidden-files: true
