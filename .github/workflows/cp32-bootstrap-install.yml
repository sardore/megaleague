      - name: Decode exact validation payload
        shell: bash
        env:
          CP32_CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cp32-validation-payload"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          base64 -d "$RUNNER_TEMP/cp32-validation-payload.b64" > "$RUNNER_TEMP/cp32-validation-payload.tar.gz"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/cp32-validation-payload.tar.gz" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c%s "$RUNNER_TEMP/cp32-validation-payload.tar.gz")"
          printf '{"expectedSha256":"%s","actualSha256":"%s","expectedSize":%s,"actualSize":%s}\n' "$CP32_PAYLOAD_SHA256" "$ACTUAL_SHA" "$CP32_PAYLOAD_SIZE" "$ACTUAL_SIZE" > artifacts/bootstrap/payload-identity.json
          [[ "$ACTUAL_SHA" == "$CP32_PAYLOAD_SHA256" && "$ACTUAL_SIZE" == "$CP32_PAYLOAD_SIZE" ]] || { echo 'BOOTSTRAP_PAYLOAD_IDENTITY_MISMATCH' >&2; exit 2; }
          tar -xzf "$RUNNER_TEMP/cp32-validation-payload.tar.gz" -C "$STAGE"
          mkdir -p "$STAGE/trusted" "$STAGE/validation/bootstrap"
          cp "$CP32_CANDIDATE_PATH" "$STAGE/trusted/CP32_ACTIVE_WRAPPER_CUTOVER_TRUSTED_BASELINE_20260805T2220KST.html"
          cp "$CP32_CANDIDATE_PATH" "$STAGE/validation/bootstrap/CP32_TRUSTED_CANDIDATE.html"
          echo "CP32_STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Resolve package lock when network permits
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$CP32_STAGE"
          NODE_VERSION="$(node --version)"; NPM_VERSION="$(npm --version)"
          BEFORE="$(sha256sum package-lock.json | awk '{print $1}')"
          set +e
          timeout 120s npm install --package-lock-only --ignore-scripts --no-audit --no-fund > "$GITHUB_WORKSPACE/artifacts/bootstrap/npm-lock.stdout.log" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/npm-lock.stderr.log"
          RC=$?
          set -e
          AFTER="$(sha256sum package-lock.json | awk '{print $1}')"
          if [[ $RC -eq 0 ]]; then STATUS='RESOLVED_ON_GITHUB_RUNNER'; else STATUS='PACKAGE_LOCK_RESOLUTION_PENDING'; fi
          printf '{"status":"%s","exitCode":%s,"node":"%s","npm":"%s","beforeSha256":"%s","afterSha256":"%s"}\n' "$STATUS" "$RC" "$NODE_VERSION" "$NPM_VERSION" "$BEFORE" "$AFTER" > "$GITHUB_WORKSPACE/artifacts/bootstrap/package-lock-status.json"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Static validation and forbidden-operation guard
        shell: bash
        run: |
          set -euo pipefail
          cd "$CP32_STAGE"
          node tools/static-validation.js > "$GITHUB_WORKSPACE/artifacts/bootstrap/static-validation.stdout.log" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/static-validation.stderr.log"
          ruby -e "require 'yaml'; ARGV.each { |f| YAML.load_file(f); puts 'YAML_OK '+f }" .github/workflows/cp32-trusted-candidate-e2e.yml .github/workflows/cp32-android-background-e2e.yml .github/workflows/cp32-production-e2e.yml > "$GITHUB_WORKSPACE/artifacts/bootstrap/yaml-parse.log"
          python3 - <<'PYGUARD'
          import json,re
          from pathlib import Path
          roots=[Path('tests'),Path('.github/workflows'),Path('tools'),Path('playwright.config.js')]
          files=[]
          for r in roots:
            if r.is_file(): files.append(r)
            elif r.exists(): files.extend(p for p in r.rglob('*') if p.is_file())
          forbidden=['page.setContent(', 'file://', 'new WebSocket("ws://127.0.0.1', 'mock relay', 'fake relay', 'window.startBattle(', 'renderBattle(', 'document.hidden =', '.style.display =']
          hits=[]
          for p in files:
            text=p.read_text(errors='ignore')
            for token in forbidden:
              if token in text: hits.append({'file':str(p),'token':token})
          production='https://sardore.github.io/megaleague/?relay=wss%3A%2F%2Fcp32-online-relay.onrender.com%2Fonline'
          relay='wss://cp32-online-relay.onrender.com/online'
          constants=Path('tests/helpers/constants.js').read_text()
          checks={'productionUrlExact':production in constants,'relayExact':relay in constants,'urlApi':('new URL(' in constants and 'searchParams.set' in constants),'forbiddenHits':hits}
          Path('artifacts').mkdir(exist_ok=True)
          Path('artifacts/bootstrap-forbidden-guard.json').write_text(json.dumps(checks,indent=2))
          if hits or not all([checks['productionUrlExact'],checks['relayExact'],checks['urlApi']]): raise SystemExit('VALIDATION_STATIC_GUARD_FAILED')
          PYGUARD
          cp artifacts/results/static-validation.json "$GITHUB_WORKSPACE/artifacts/bootstrap/static-validation.json"
          cp artifacts/bootstrap-forbidden-guard.json "$GITHUB_WORKSPACE/artifacts/bootstrap/forbidden-guard.json"

      - name: Build repository-ready tree and checksums
        shell: bash
        run: |
          set -euo pipefail
          READY="$GITHUB_WORKSPACE/artifacts/bootstrap/repository-ready"
          rm -rf "$READY"; mkdir -p "$READY"
          rsync -a --exclude artifacts/ "$CP32_STAGE/" "$READY/"
          python3 - <<'PYMANIFEST'
          import hashlib,json,os
          from pathlib import Path
          root=Path('artifacts/bootstrap/repository-ready')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
            b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'status':'CP32_EXTERNAL_PLAYER_PATH_VALIDATION_PIPELINE_READY','generatedBy':'CP32 Bootstrap Install','runId':os.environ.get('GITHUB_RUN_ID'),'trustedSha256':os.environ['CP32_EXPECTED_SHA256'],'productionUrl':os.environ['CP32_PRODUCTION_URL'],'relayEndpoint':os.environ['CP32_RELAY_ENDPOINT'],'files':rows}
          (root/'VALIDATION_INSTALL_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          with (root/'VALIDATION_INSTALL_SHA256SUMS.txt').open('w') as f:
            for row in rows: f.write(f"{row['sha256']}  {row['path']}\n")
          PYMANIFEST
          cd "$READY/.."
          zip -qr cp32-validation-install-ready.zip repository-ready
          sha256sum cp32-validation-install-ready.zip > cp32-validation-install-ready.zip.sha256

      - name: Attempt AUTO_INSTALL branch and PR
        id: autoinstall
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          READY="$GITHUB_WORKSPACE/artifacts/bootstrap/repository-ready"
          BASE="${{ github.event.repository.default_branch }}"
          BRANCH='cp32-validation-bootstrap'
          if git ls-remote --exit-code --heads origin "refs/heads/$BRANCH" >/dev/null 2>&1; then BRANCH="cp32-validation-bootstrap-${{ github.run_id }}"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          rsync -a "$READY/" "$GITHUB_WORKSPACE/"
          git add .github/workflows tests tools trusted validation/bootstrap playwright.config.js package.json package-lock.json README_EXTERNAL_AUTOMATION.md
          if git diff --cached --quiet; then
            STATUS='AUTO_INSTALL_ALREADY_PRESENT'; PUSH_RC=0; PR_RC=0; PR_URL='';
          else
            git commit -m 'Install CP32 external validation pipeline'
            set +e
            git push -u origin "$BRANCH" > artifacts/bootstrap/git-push.stdout.log 2> artifacts/bootstrap/git-push.stderr.log
            PUSH_RC=$?
            set -e
            PR_RC=99; PR_URL=''
            if [[ $PUSH_RC -eq 0 ]]; then
              set +e
              PR_URL="$(gh pr create --base "$BASE" --head "$BRANCH" --title 'Install CP32 validation automation' --body 'Installs exact-byte candidate, web E2E, Android lifecycle E2E, and production identity/player-path validation. Does not modify production game source.' 2> artifacts/bootstrap/pr-create.stderr.log)"
              PR_RC=$?
              set -e
              if [[ $PR_RC -eq 0 ]]; then STATUS='AUTO_INSTALL_PR_READY'; else STATUS='AUTO_INSTALL_BRANCH_READY_PR_BLOCKED'; fi
            else STATUS='GITHUB_REPOSITORY_WRITE_BLOCKED_ARTIFACT_READY'; fi
          fi
          printf '{"status":"%s","branch":"%s","base":"%s","pushExitCode":%s,"prExitCode":%s,"prUrl":"%s","fallbackArtifact":"cp32-validation-install-ready.zip"}\n' "$STATUS" "$BRANCH" "$BASE" "$PUSH_RC" "$PR_RC" "$PR_URL" > artifacts/bootstrap/auto-install-status.json
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CP32 Bootstrap Install'
            echo
            echo "Trusted SHA: $CP32_EXPECTED_SHA256"
            echo "Production URL: $CP32_PRODUCTION_URL"
            echo "Relay: $CP32_RELAY_ENDPOINT"
            [[ -f artifacts/bootstrap/auto-install-status.json ]] && cat artifacts/bootstrap/auto-install-status.json
            echo
            echo 'If repository writes are blocked, download the single `cp32-validation-install-ready.zip` artifact. No production game source was patched.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap evidence / fallback installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-bootstrap-install-${{ github.run_id }}
          path: artifacts/bootstrap/
          if-no-files-found: error
          include-hidden-files: true
