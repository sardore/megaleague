      - name: Decode exact validation payload
        shell: bash
        env:
          CP32_CANDIDATE_PATH: ${{ steps.candidate.outputs.path }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/cp32-validation-payload"
          rm -rf "$STAGE"; mkdir -p "$STAGE"
          base64 -d "$RUNNER_TEMP/cp32-validation-payload.b64" > "$RUNNER_TEMP/cp32-validation-payload.tar.gz"
          ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/cp32-validation-payload.tar.gz" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -c%s "$RUNNER_TEMP/cp32-validation-payload.tar.gz")"
          printf '{"expectedSha256":"%s","actualSha256":"%s","expectedSize":%s,"actualSize":%s}\n' "$CP32_PAYLOAD_SHA256" "$ACTUAL_SHA" "$CP32_PAYLOAD_SIZE" "$ACTUAL_SIZE" > artifacts/bootstrap/payload-identity.json
          [[ "$ACTUAL_SHA" == "$CP32_PAYLOAD_SHA256" && "$ACTUAL_SIZE" == "$CP32_PAYLOAD_SIZE" ]] || { echo 'BOOTSTRAP_PAYLOAD_IDENTITY_MISMATCH' >&2; exit 2; }
          tar -xzf "$RUNNER_TEMP/cp32-validation-payload.tar.gz" -C "$STAGE"
          mkdir -p "$STAGE/trusted" "$STAGE/validation/bootstrap"
          cp "$CP32_CANDIDATE_PATH" "$STAGE/trusted/CP32_ACTIVE_WRAPPER_CUTOVER_TRUSTED_BASELINE_20260805T2220KST.html"
          cp "$CP32_CANDIDATE_PATH" "$STAGE/validation/bootstrap/CP32_TRUSTED_CANDIDATE.html"
          echo "CP32_STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Resolve package lock when network permits
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          cd "$CP32_STAGE"
          NODE_VERSION="$(node --version)"; NPM_VERSION="$(npm --version)"
          BEFORE="$(sha256sum package-lock.json | awk '{print $1}')"
          set +e
          timeout 120s npm install --package-lock-only --ignore-scripts --no-audit --no-fund > "$GITHUB_WORKSPACE/artifacts/bootstrap/npm-lock.stdout.log" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/npm-lock.stderr.log"
          RC=$?
          set -e
          AFTER="$(sha256sum package-lock.json | awk '{print $1}')"
          if [[ $RC -eq 0 ]]; then STATUS='RESOLVED_ON_GITHUB_RUNNER'; else STATUS='PACKAGE_LOCK_RESOLUTION_PENDING'; fi
          printf '{"status":"%s","exitCode":%s,"node":"%s","npm":"%s","beforeSha256":"%s","afterSha256":"%s"}\n' "$STATUS" "$RC" "$NODE_VERSION" "$NPM_VERSION" "$BEFORE" "$AFTER" > "$GITHUB_WORKSPACE/artifacts/bootstrap/package-lock-status.json"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Static validation and forbidden-operation guard
        shell: bash
        run: |
          set -euo pipefail
          cd "$CP32_STAGE"
          node tools/forbidden-guard-regression.js > "$GITHUB_WORKSPACE/artifacts/bootstrap/forbidden-guard-regression.stdout.log" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/forbidden-guard-regression.stderr.log"
          node tools/static-validation.js > "$GITHUB_WORKSPACE/artifacts/bootstrap/static-validation.stdout.log" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/static-validation.stderr.log"
          ruby -e "require 'yaml'; ARGV.each { |f| YAML.load_file(f); puts 'YAML_OK '+f }" .github/workflows/cp32-trusted-candidate-e2e.yml .github/workflows/cp32-android-background-e2e.yml .github/workflows/cp32-production-e2e.yml > "$GITHUB_WORKSPACE/artifacts/bootstrap/yaml-parse.log"
          cp artifacts/results/static-validation.json "$GITHUB_WORKSPACE/artifacts/bootstrap/static-validation.json"
          cp artifacts/results/FORBIDDEN_GUARD_REGRESSION.json "$GITHUB_WORKSPACE/artifacts/bootstrap/FORBIDDEN_GUARD_REGRESSION.json"

      - name: Build repository-ready tree and checksums
        shell: bash
        run: |
          set -euo pipefail
          READY="$GITHUB_WORKSPACE/artifacts/bootstrap/repository-ready"
          rm -rf "$READY"; mkdir -p "$READY"
          rsync -a --exclude artifacts/ "$CP32_STAGE/" "$READY/"
          python3 - <<'PYMANIFEST'
          import hashlib,json,os
          from pathlib import Path
          root=Path('artifacts/bootstrap/repository-ready')
          rows=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
            b=p.read_bytes(); rows.append({'path':str(p.relative_to(root)),'size':len(b),'sha256':hashlib.sha256(b).hexdigest()})
          manifest={'status':'CP32_EXTERNAL_PLAYER_PATH_VALIDATION_PIPELINE_READY','generatedBy':'CP32 Bootstrap Install','runId':os.environ.get('GITHUB_RUN_ID'),'trustedSha256':os.environ['CP32_EXPECTED_SHA256'],'productionUrl':os.environ['CP32_PRODUCTION_URL'],'relayEndpoint':os.environ['CP32_RELAY_ENDPOINT'],'files':rows}
          (root/'VALIDATION_INSTALL_MANIFEST.json').write_text(json.dumps(manifest,indent=2))
          with (root/'VALIDATION_INSTALL_SHA256SUMS.txt').open('w') as f:
            for row in rows: f.write(f"{row['sha256']}  {row['path']}\n")
          PYMANIFEST
          cd "$READY/.."
          zip -qr cp32-validation-install-ready.zip repository-ready
          sha256sum cp32-validation-install-ready.zip > cp32-validation-install-ready.zip.sha256

      - name: Require PAT and perform canonical credential differential and remote install
        id: autoinstall
        shell: bash
        env:
          CP32_BOOTSTRAP_PAT: ${{ secrets.CP32_BOOTSTRAP_PAT }}
        run: |
          set -euo pipefail
          READY="$GITHUB_WORKSPACE/artifacts/bootstrap/repository-ready"
          BASE="${{ github.event.repository.default_branch }}"
          BRANCH='cp32-validation-bootstrap'
          STATUS_FILE="$GITHUB_WORKSPACE/artifacts/bootstrap/auto-install-status.json"
          AUTH_DIFF_FILE="$GITHUB_WORKSPACE/artifacts/bootstrap/credential-differential.json"
          GIT_AUTH_CONFIG="$RUNNER_TEMP/cp32-bootstrap-gh-gitconfig"
          LOCAL_SHA=''
          REMOTE_SHA=''
          PR_URL=''
          PUSH_RC=99
          PR_RC=99
          REMOTE_BRANCH_EXISTS=false
          API_IDENTITY_AUTH='NOT_RUN'
          API_REPOSITORY_ACCESS='NOT_RUN'
          GIT_HTTPS_READ_AUTH='NOT_RUN'
          GIT_HTTPS_WRITE_AUTH='NOT_RUN'
          API_LOGIN=''
          BASE_REF_OBSERVED=false

          write_status() {
            python3 - "$STATUS_FILE" "$1" "$BRANCH" "$BASE" "$PUSH_RC" "$PR_RC" "$PR_URL" "$LOCAL_SHA" "$REMOTE_SHA" "$REMOTE_BRANCH_EXISTS" <<'PYSTATUS'
          import json,sys
          path,status,branch,base,push_rc,pr_rc,pr_url,local_sha,remote_sha,remote_exists=sys.argv[1:]
          rec={
            'status':status,
            'branch':branch,
            'base':base,
            'pushExitCode':int(push_rc),
            'prExitCode':int(pr_rc),
            'prUrl':pr_url,
            'localCommitSha':local_sha,
            'remoteCommitSha':remote_sha,
            'remoteBranchExists':remote_exists.lower()=='true',
            'fallbackArtifact':'cp32-validation-install-ready.zip',
            'authMode':'CP32_BOOTSTRAP_PAT_GH_CLI_GIT_CREDENTIAL_HELPER',
            'secretName':'CP32_BOOTSTRAP_PAT'
          }
          open(path,'w',encoding='utf-8').write(json.dumps(rec,indent=2)+'\\n')
          PYSTATUS
          }

          write_auth_diff() {
            python3 - "$AUTH_DIFF_FILE" "$API_IDENTITY_AUTH" "$API_REPOSITORY_ACCESS" "$GIT_HTTPS_READ_AUTH" "$GIT_HTTPS_WRITE_AUTH" "$API_LOGIN" "$BASE_REF_OBSERVED" <<'PYAUTHDIFF'
          import json,sys
          path,api_identity,api_repo,git_read,git_write,login,base_seen=sys.argv[1:]
          rec={
            'credentialOwner':'GH_CLI_GIT_CREDENTIAL_HELPER',
            'secretName':'CP32_BOOTSTRAP_PAT',
            'API_IDENTITY_AUTH':api_identity,
            'API_REPOSITORY_ACCESS':api_repo,
            'GIT_HTTPS_READ_AUTH':git_read,
            'GIT_HTTPS_WRITE_AUTH':git_write,
            'authenticatedLogin':login,
            'baseRefObserved':base_seen.lower()=='true',
            'tokenMaterialRecorded':False
          }
          open(path,'w',encoding='utf-8').write(json.dumps(rec,indent=2)+'\\n')
          PYAUTHDIFF
          }

          cleanup_credentials() {
            set +e
            unset GH_TOKEN
            unset CP32_BOOTSTRAP_PAT
            unset GIT_CONFIG_GLOBAL
            rm -f "$GIT_AUTH_CONFIG"
            set -e
          }
          trap cleanup_credentials EXIT

          if [[ -z "${CP32_BOOTSTRAP_PAT:-}" ]]; then
            STATUS='CP32_BOOTSTRAP_PAT_REQUIRED_FOR_WORKFLOW_FILE_INSTALL'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 21
          fi

          # One canonical auth owner for both gh API calls and Git HTTPS transport.
          # checkout intentionally persists no GITHUB_TOKEN credential.
          export GH_TOKEN="$CP32_BOOTSTRAP_PAT"
          export GIT_CONFIG_GLOBAL="$GIT_AUTH_CONFIG"
          : > "$GIT_AUTH_CONFIG"
          chmod 600 "$GIT_AUTH_CONFIG"
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

          # A. API identity authentication.
          set +e
          API_LOGIN="$(gh api user --jq '.login' 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/api-identity-auth.stderr.log")"
          API_ID_RC=$?
          set -e
          if [[ $API_ID_RC -ne 0 || -z "$API_LOGIN" ]]; then
            API_IDENTITY_AUTH='FAIL'
            STATUS='CP32_BOOTSTRAP_PAT_AUTH_FAILED'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 22
          fi
          API_IDENTITY_AUTH='PASS'
          printf '%s\n' "$API_LOGIN" > "$GITHUB_WORKSPACE/artifacts/bootstrap/api-identity-auth-user.txt"
          write_auth_diff

          # B. API repository access. This verifies the PAT can address the exact repository;
          # Git write authority is still decided by the later Git transport operation.
          set +e
          gh api "repos/$GITHUB_REPOSITORY" --jq '{fullName:.full_name,defaultBranch:.default_branch,visibility:.visibility,permissions:.permissions}' > "$GITHUB_WORKSPACE/artifacts/bootstrap/api-repository-access.json" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/api-repository-access.stderr.log"
          API_REPO_RC=$?
          set -e
          if [[ $API_REPO_RC -ne 0 ]]; then
            API_REPOSITORY_ACCESS='FAIL'
            STATUS='CP32_BOOTSTRAP_PAT_REPOSITORY_ACCESS_FAILED'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 26
          fi
          API_REPOSITORY_ACCESS='PASS'
          write_auth_diff

          # Configure Git HTTPS through the official GitHub CLI credential helper.
          # The token remains in GH_TOKEN for this step; it is never embedded in origin URL,
          # command arguments, committed files, or artifacts.
          set +e
          gh auth setup-git --hostname github.com --force > "$GITHUB_WORKSPACE/artifacts/bootstrap/gh-auth-setup-git.stdout.log" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/gh-auth-setup-git.stderr.log"
          SETUP_GIT_RC=$?
          set -e
          if [[ $SETUP_GIT_RC -ne 0 ]]; then
            GIT_HTTPS_READ_AUTH='FAIL'
            STATUS='CP32_BOOTSTRAP_GIT_CREDENTIAL_SETUP_FAILED'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 27
          fi
          git config --global --get-regexp '^credential\..*\.helper$' > "$GITHUB_WORKSPACE/artifacts/bootstrap/git-credential-helper-config.txt"

          # C. Git HTTPS read authentication. No --exit-code: transport/auth failure and
          # a successfully authenticated but missing ref must remain distinguishable.
          set +e
          BASE_REMOTE_LINE="$(git ls-remote origin "refs/heads/$BASE" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/git-https-read.stderr.log")"
          GIT_READ_RC=$?
          set -e
          printf '%s\n' "$BASE_REMOTE_LINE" > "$GITHUB_WORKSPACE/artifacts/bootstrap/git-https-read.stdout.log"
          if [[ $GIT_READ_RC -ne 0 ]]; then
            GIT_HTTPS_READ_AUTH='FAIL'
            STATUS='CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 28
          fi
          GIT_HTTPS_READ_AUTH='PASS'
          if [[ -z "$BASE_REMOTE_LINE" ]]; then
            BASE_REF_OBSERVED=false
            STATUS='CP32_BOOTSTRAP_BASE_REF_NOT_OBSERVED'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 29
          fi
          BASE_REF_OBSERVED=true
          write_auth_diff

          # Branch collision observation uses the already-proven canonical Git credential path.
          set +e
          EXISTING_BRANCH_LINE="$(git ls-remote origin "refs/heads/$BRANCH" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/branch-collision-check.stderr.log")"
          BRANCH_CHECK_RC=$?
          set -e
          if [[ $BRANCH_CHECK_RC -ne 0 ]]; then
            GIT_HTTPS_READ_AUTH='FAIL'
            STATUS='CP32_BOOTSTRAP_GIT_HTTPS_READ_AUTH_FAILED'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 28
          fi
          if [[ -n "$EXISTING_BRANCH_LINE" ]]; then
            BRANCH="cp32-validation-bootstrap-${{ github.run_id }}"
          fi

          git config user.name 'cp32-bootstrap-installer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          rsync -a "$READY/" "$GITHUB_WORKSPACE/"
          git add .github/workflows tests tools trusted validation/bootstrap playwright.config.js package.json package-lock.json README_EXTERNAL_AUTOMATION.md

          if git diff --cached --quiet; then
            LOCAL_SHA="$(git rev-parse HEAD)"
            STATUS='AUTO_INSTALL_ALREADY_PRESENT'
            PUSH_RC=0
            PR_RC=0
            GIT_HTTPS_WRITE_AUTH='NOT_REQUIRED'
            write_auth_diff
            write_status "$STATUS"
            echo "status=$STATUS" >> "$GITHUB_OUTPUT"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m 'Install CP32 external validation pipeline'
          LOCAL_SHA="$(git rev-parse HEAD)"

          # D. Git HTTPS write authentication is the actual branch push. This is attempted
          # only after API identity, repository access, and Git HTTPS read auth have passed.
          set +e
          git push -u origin "$BRANCH" > "$GITHUB_WORKSPACE/artifacts/bootstrap/git-push.stdout.log" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/git-push.stderr.log"
          PUSH_RC=$?
          set -e
          if [[ $PUSH_RC -ne 0 ]]; then
            GIT_HTTPS_WRITE_AUTH='FAIL'
            PUSH_ERR="$(cat "$GITHUB_WORKSPACE/artifacts/bootstrap/git-push.stderr.log")"
            if printf '%s' "$PUSH_ERR" | grep -Eqi 'Invalid username or token|Authentication failed|could not read Username'; then
              STATUS='CP32_BOOTSTRAP_GIT_HTTPS_WRITE_AUTH_FAILED'
            elif printf '%s' "$PUSH_ERR" | grep -Eqi 'refusing to allow .* to create or update workflow|workflow.*permission|Write access to repository not granted|Permission to .* denied|HTTP 403|returned error: 403'; then
              STATUS='CP32_BOOTSTRAP_GIT_HTTPS_WRITE_PERMISSION_FAILED'
            else
              STATUS='CP32_BOOTSTRAP_REMOTE_PUSH_FAILED'
            fi
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 23
          fi
          GIT_HTTPS_WRITE_AUTH='PASS'
          write_auth_diff

          # Independent remote observation: push exit 0 is not enough.
          set +e
          REMOTE_LINE="$(git ls-remote origin "refs/heads/$BRANCH" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/remote-branch-check.stderr.log")"
          REMOTE_CHECK_RC=$?
          set -e
          printf '%s\n' "$REMOTE_LINE" > "$GITHUB_WORKSPACE/artifacts/bootstrap/remote-branch-check.stdout.log"
          if [[ $REMOTE_CHECK_RC -ne 0 ]]; then
            STATUS='CP32_BOOTSTRAP_REMOTE_BRANCH_OBSERVATION_TRANSPORT_FAILED'
            write_auth_diff
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 30
          fi
          REMOTE_SHA="$(printf '%s\n' "$REMOTE_LINE" | awk 'NF>=2 {print $1; exit}')"
          if [[ -z "$REMOTE_SHA" || "$REMOTE_SHA" != "$LOCAL_SHA" ]]; then
            STATUS='CP32_BOOTSTRAP_REMOTE_BRANCH_NOT_OBSERVED'
            REMOTE_BRANCH_EXISTS=false
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 24
          fi
          REMOTE_BRANCH_EXISTS=true
          printf '%s\n' "REMOTE_BRANCH_EXISTS=true" "LOCAL_SHA=$LOCAL_SHA" "REMOTE_SHA=$REMOTE_SHA" > "$GITHUB_WORKSPACE/artifacts/bootstrap/remote-branch-proof.txt"

          # PR creation uses the same GH_TOKEN/PAT owner as API and Git credential helper.
          set +e
          PR_URL="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$BRANCH" --title 'Install CP32 validation automation' --body 'Installs exact-byte candidate, web E2E, Android lifecycle E2E, and production identity/player-path validation. Does not modify production game source.' 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/pr-create.stderr.log")"
          PR_RC=$?
          set -e
          if [[ $PR_RC -ne 0 || -z "$PR_URL" ]]; then
            STATUS='CP32_BOOTSTRAP_PR_CREATE_FAILED'
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 25
          fi

          set +e
          gh pr view "$PR_URL" --repo "$GITHUB_REPOSITORY" --json url,headRefName,baseRefName,state > "$GITHUB_WORKSPACE/artifacts/bootstrap/pr-proof.json" 2> "$GITHUB_WORKSPACE/artifacts/bootstrap/pr-proof.stderr.log"
          PR_VERIFY_RC=$?
          set -e
          if [[ $PR_VERIFY_RC -ne 0 ]]; then
            STATUS='CP32_BOOTSTRAP_PR_CREATE_FAILED'
            write_status "$STATUS"
            echo "$STATUS" >&2
            exit 25
          fi
          python3 - "$GITHUB_WORKSPACE/artifacts/bootstrap/pr-proof.json" "$BRANCH" "$BASE" <<'PYPRVERIFY'
          import json,sys
          path,head,base=sys.argv[1:]
          obj=json.load(open(path,encoding='utf-8'))
          ok=(obj.get('headRefName')==head and obj.get('baseRefName')==base and obj.get('state')=='OPEN' and bool(obj.get('url')))
          if not ok:
              raise SystemExit('CP32_BOOTSTRAP_PR_CREATE_FAILED')
          PYPRVERIFY

          STATUS='AUTO_INSTALL_PR_READY'
          write_status "$STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Verify PAT was not written to bootstrap evidence
        if: always()
        shell: bash
        env:
          CP32_BOOTSTRAP_PAT: ${{ secrets.CP32_BOOTSTRAP_PAT }}
        run: |
          set -euo pipefail
          python3 - <<'PYLEAK'
          import json,os
          from pathlib import Path
          token=os.environ.get('CP32_BOOTSTRAP_PAT','')
          root=Path('artifacts/bootstrap')
          hits=[]
          if token:
              needle=token.encode()
              for p in root.rglob('*') if root.exists() else []:
                  if p.is_file():
                      try: data=p.read_bytes()
                      except OSError: continue
                      if needle in data: hits.append(str(p))
          report={'secretName':'CP32_BOOTSTRAP_PAT','tokenPresentInEvidence':bool(hits),'hitCount':len(hits),'paths':hits}
          (root/'pat-leakage-guard.json').write_text(json.dumps(report,indent=2)+'\\n',encoding='utf-8')
          if hits: raise SystemExit('CP32_BOOTSTRAP_PAT_EVIDENCE_LEAK_DETECTED')
          PYLEAK

      - name: Installation summary
        if: always()
        shell: bash
        run: |
          {
            echo '## CP32 Bootstrap Install'
            echo
            echo "Trusted SHA: $CP32_EXPECTED_SHA256"
            echo "Production URL: $CP32_PRODUCTION_URL"
            echo "Relay: $CP32_RELAY_ENDPOINT"
            [[ -f artifacts/bootstrap/auto-install-status.json ]] && cat artifacts/bootstrap/auto-install-status.json
            echo
            echo 'AUTO_INSTALL requires repository secret `CP32_BOOTSTRAP_PAT`. If PAT authentication, workflow-file push, or PR creation is blocked, the single `cp32-validation-install-ready.zip` fallback artifact remains available. No production game source was patched.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bootstrap evidence / fallback installer
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cp32-bootstrap-install-${{ github.run_id }}
          path: artifacts/bootstrap/
          if-no-files-found: error
          include-hidden-files: true

