          expected={".github/workflows/cp32-trusted-candidate-e2e.yml":"f03f2da0d5e9079c48b07021a13eb75593fbd8991d35e035a817203e82819c94",".github/workflows/cp32-android-background-e2e.yml":"6d9a26b94df0bff6cf69a9468f46fb61473e5970283fa3d055988ae8de63fbbe",".github/workflows/cp32-production-e2e.yml":"17b4677a36610a960f17842d6e9d597e42b75a5f1a18bdea1fc1545bfda65641","playwright.config.js":"607657a8b44385252fd66d3b1406067a5397676aded9330f6ca8dec08c19502f","tests/helpers/two-independent-clients.js":"ee2729365ec0e07be18e17c6d945e2f87d36f1fbef2220e21bc623d32777aedb","tests/helpers/evidence-recorder.js":"08709e669bafdf6653db8c7c8e45874d3be766abffcd7f281acf021a70ad8440","tests/helpers/player-path.js":"28021c5d3e0ba94e972a97a0a5d7f7603ca1dfd6b6ba63febab6c30b39f16694","tests/helpers/diagnostic-export.js":"87905a0b09639ef8da147c430c516a2a04bf8027dffdc32dd066cbf7dee7e854","tests/android/android-peer-client.js":"54f9d22508e49fab9fe311443b8d4b36eb1a4b77b8589b0f39b048c98615d988","tests/android/android-background-player-path.js":"ab1ffa87e719917241a231447f1c32a5406a0922783ec0c47397bb43c132bcc5","tests/e2e/gate-harness.js":"29cbd8e61d94dad4a7df59e8a7fb7402b77f0f328cbaeb2a49d903bd698f7d15","tests/e2e/trusted-candidate-player-path.spec.js":"f943d5ff21981c77de8383b0479b2fa0eaa22f425fb4396ed0d8cccdb853d4c6","tests/e2e/production-player-path.spec.js":"c5353012df8472670df1eb328aa34314eb15c46ed457c71edc43b4230aff9ffe","tests/e2e/lobby-background-sync.spec.js":"6e971fa75cd39920be480f0b00b4d67dd655c407d180751cb8c637c69304dd63","tests/e2e/result-setup-stability.spec.js":"75f217123598e8ade08d6831b4c2ecec13aae06ba33b03f696d605effc6ed86b","tools/static-validation.js":"6e742702bdbfa6e7cf01b10b24b7470a4c8d301961d3b96b2e81e4a388a76933"}
