name: CP32 Bootstrap Install

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: cp32-validation-artifact-lifecycle-r6
  cancel-in-progress: false

env:
  CP32_EXPECTED_SHA256: fbbdad911cb6c90a95aaedb9cf66820f41dc2a323e90088a3cb5ee4d407b22a8
  CP32_EXPECTED_SIZE: '7372055'
  CP32_EXPECTED_BUILD: CP32-ACTIVE-WRAPPER-CUTOVER-R1-20260805T2220KST
  CP32_CORRECTION_PAYLOAD_SHA256: 1c93a4c8eb75b48767de5bc86b32f935e37aec4684daa7ac9b81f8ce52408ebc
  CP32_CORRECTION_PAYLOAD_SIZE: '2892'
  CP32_PARENT_CANDIDATE_WORKFLOW_SHA256: cec693da8417342bbd9badbb294e0c22256565f2da1845e0a1bd863e64e278af
  CP32_PARENT_ANDROID_WORKFLOW_SHA256: 26a12a7fc75b5127ecf2015b820f58d4a607c780a51d278b1f74393fa77802e9
  CP32_PARENT_PRODUCTION_WORKFLOW_SHA256: a7545e3f33081235799c626fb2267083eee1cac3f98989452437ab9488815e86

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Initialize bootstrap evidence root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          printf '%s\n'             "run_id=$GITHUB_RUN_ID"             "repository=$GITHUB_REPOSITORY"             "source_sha=$GITHUB_SHA"             "default_branch=${{ github.event.repository.default_branch }}"             > artifacts/bootstrap/run-context.txt

      - name: Verify trusted source and current validation parents
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPARENT'
          import hashlib, json, os
          from pathlib import Path

          expected_html=os.environ['CP32_EXPECTED_SHA256']
          expected_size=int(os.environ['CP32_EXPECTED_SIZE'])
          expected_build=os.environ['CP32_EXPECTED_BUILD'].encode()
          html_candidates=[
            Path('trusted/CP32_ACTIVE_WRAPPER_CUTOVER_TRUSTED_BASELINE_20260805T2220KST.html'),
            Path('validation/bootstrap/CP32_TRUSTED_CANDIDATE.html'),
            Path('validation/bootstrap/MOBILE_UPLOAD_02_CP32_TRUSTED_CANDIDATE.html'),
          ]
          html_rows=[]
          trusted_ok=False
          for p in html_candidates:
            if not p.is_file():
              html_rows.append({'path':str(p),'exists':False}); continue
            b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest()
            row={'path':str(p),'exists':True,'size':len(b),'sha256':sha,'buildPresent':expected_build in b,'exact':sha==expected_html and len(b)==expected_size and expected_build in b}
            html_rows.append(row); trusted_ok = trusted_ok or row['exact']

          workflows={
            '.github/workflows/cp32-trusted-candidate-e2e.yml':os.environ['CP32_PARENT_CANDIDATE_WORKFLOW_SHA256'],
            '.github/workflows/cp32-android-background-e2e.yml':os.environ['CP32_PARENT_ANDROID_WORKFLOW_SHA256'],
            '.github/workflows/cp32-production-e2e.yml':os.environ['CP32_PARENT_PRODUCTION_WORKFLOW_SHA256'],
          }
          wf_rows=[]; wf_ok=True
          for name,expected in workflows.items():
            p=Path(name)
            if not p.is_file():
              wf_rows.append({'path':name,'exists':False,'expectedSha256':expected}); wf_ok=False; continue
            sha=hashlib.sha256(p.read_bytes()).hexdigest()
            wf_rows.append({'path':name,'exists':True,'sha256':sha,'expectedSha256':expected,'exact':sha==expected})
            wf_ok = wf_ok and sha==expected
          out={'trustedHtml':html_rows,'trustedHtmlExactObserved':trusted_ok,'parentWorkflows':wf_rows,'parentWorkflowIdentityPass':wf_ok}
          Path('artifacts/bootstrap/parent-authority-verification.json').write_text(json.dumps(out,indent=2)+'\n')
          if not trusted_ok: raise SystemExit('TRUSTED_HTML_IDENTITY_MISMATCH')
          if not wf_ok: raise SystemExit('VALIDATION_PARENT_WORKFLOW_IDENTITY_MISMATCH')
          PYPARENT

      - name: Decode bounded R6 correction payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cp32-r6-correction"
          cat > "$RUNNER_TEMP/cp32-r6-correction.b64" <<'CP32_R6_PAYLOAD'
          H4sIAN4Xd2oC/+0ba3faRjaf8yumnDSCrQUYP5LKSxsMskNLgOXRnmw2hyOkAaaWNKpmZIc6/u97
