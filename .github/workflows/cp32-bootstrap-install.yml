          for p in candidates:
            if not p.is_file(): trusted.append({'path':str(p),'exists':False}); continue
            b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest(); exact=sha==trusted_sha and len(b)==trusted_size and trusted_build in b
            trusted.append({'path':str(p),'exists':True,'sha256':sha,'size':len(b),'exact':exact}); trusted_ok=trusted_ok or exact
