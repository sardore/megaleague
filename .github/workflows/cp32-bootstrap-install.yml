name: CP32 Bootstrap Install

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: cp32-player-path-harness-ownership-r9
  cancel-in-progress: false

env:
  CP32_EXPECTED_SHA256: fbbdad911cb6c90a95aaedb9cf66820f41dc2a323e90088a3cb5ee4d407b22a8
  CP32_EXPECTED_SIZE: '7372055'
  CP32_EXPECTED_BUILD: CP32-ACTIVE-WRAPPER-CUTOVER-R1-20260805T2220KST
  CP32_CORRECTION_PAYLOAD_SHA256: 0b14737123efbf8c0896d3f30c0c529a8fdf31c326b18629363c956329e91dd2
  CP32_CORRECTION_PAYLOAD_SIZE: '20975'

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout current default branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}

      - name: Initialize bootstrap evidence root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          printf '%s\n' "run_id=$GITHUB_RUN_ID" "repository=$GITHUB_REPOSITORY" "source_sha=$GITHUB_SHA" > artifacts/bootstrap/run-context.txt

      - name: Verify trusted source and R9 parent harness authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPARENT'
