name: CP32 Bootstrap Install

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: cp32-bootstrap-install
  cancel-in-progress: false

env:
  CP32_EXPECTED_SHA256: fbbdad911cb6c90a95aaedb9cf66820f41dc2a323e90088a3cb5ee4d407b22a8
  CP32_EXPECTED_SIZE: '7372055'
  CP32_EXPECTED_BUILD: CP32-ACTIVE-WRAPPER-CUTOVER-R1-20260805T2220KST
  CP32_PAYLOAD_SHA256: 605320d87e912f16ebf6eb672de07f0e1efd968cd84cd2edfb754b0cad9ff9ea
  CP32_PAYLOAD_SIZE: '16338'
  CP32_PRODUCTION_URL: https://sardore.github.io/megaleague/?relay=wss%3A%2F%2Fcp32-online-relay.onrender.com%2Fonline
  CP32_RELAY_ENDPOINT: wss://cp32-online-relay.onrender.com/online

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Prepare evidence directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/bootstrap
          printf '%s\n' "run_id=${{ github.run_id }}" "repository=${{ github.repository }}" "sha=${{ github.sha }}" > artifacts/bootstrap/run-context.txt

      - name: Verify trusted candidate upload
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          CANONICAL='validation/bootstrap/CP32_TRUSTED_CANDIDATE.html'
          TRANSPORT='validation/bootstrap/MOBILE_UPLOAD_02_CP32_TRUSTED_CANDIDATE.html'
          if [[ -f "$CANONICAL" ]]; then CANDIDATE="$CANONICAL";
          elif [[ -f "$TRANSPORT" ]]; then CANDIDATE="$TRANSPORT";
          else echo 'TRUSTED_CANDIDATE_UPLOAD_MISSING' >&2; exit 2; fi
          export CANDIDATE
          python3 - <<'PYVERIFY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['CANDIDATE']); b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          expected=os.environ['CP32_EXPECTED_SHA256']; size=int(os.environ['CP32_EXPECTED_SIZE']); build=os.environ['CP32_EXPECTED_BUILD'].encode()
          rec={'path':str(p),'size':len(b),'sha256':sha,'expectedSha256':expected,'expectedSize':size,'buildPresent':build in b,'ok':sha==expected and len(b)==size and build in b}
          Path('artifacts/bootstrap/candidate-identity.json').write_text(json.dumps(rec,indent=2))
          if not rec['ok']: raise SystemExit('CANDIDATE_IDENTITY_MISMATCH')
          PYVERIFY
          echo "path=$CANDIDATE" >> "$GITHUB_OUTPUT"

      - name: Initialize validation payload transport
        shell: bash
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/cp32-validation-payload.b64"

