name: PR10 Apply Revision Idempotency Fix

on:
  push:
    branches:
      - diagnose/android-lifecycle-32624812975

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'Apply canonical revision idempotency fix')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: diagnose/android-lifecycle-32624812975
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Patch canonical revision ownership
        run: node tools/apply-pr10-revision-idempotency-fix.mjs
      - name: Static validation
        run: npm run validate:static
      - name: Commit runtime fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'revision idempotency fix already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply canonical revision idempotency fix'
          git push origin HEAD:diagnose/android-lifecycle-32624812975
