name: CP32 Emote Probe Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cp32-emote-probe-once.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: true
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('index.html').read_text(encoding='utf-8')
          pats=['emote-bar','battle-emote','sendEmote','showEmote','emoteType','type:"emote"','type: "emote"','case "emote"','case \'emote\'','emoteCooldown','emotes']
          out=[]
          for p in pats:
            ms=list(re.finditer(re.escape(p),text,re.I))
            out.append(f'===== {p} count={len(ms)} =====')
            for i,m in enumerate(ms[:20]):
              out.append(f'--- {p} #{i+1} offset={m.start()} ---')
              out.append(text[max(0,m.start()-1800):min(len(text),m.end()+3200)])
          Path('CP32_EMOTE_PROBE.txt').write_text('\n'.join(out))
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/cp32-emote-probe-once.yml
          git add CP32_EMOTE_PROBE.txt
          git commit -m 'Record exact online emote probe'
          git push origin HEAD:main
