name: CP32 Terminal Action Diagnostic Once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cp32-terminal-action-diagnostic-once.yml']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CP32_RELAY_SOURCE_SHA: e6b97f0e63298d0766fc179bcfe76e80c2df44eb
      CP32_CURRENT_APP_URL: http://127.0.0.1:4173/?relay=ws%3A%2F%2F127.0.0.1%3A8787%2Fonline
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start exact relay and app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/terminal-action-diag
          git clone --no-checkout https://github.com/sardore/cp32-online-relay.git relay-src
          git -C relay-src checkout --detach "$CP32_RELAY_SOURCE_SHA"
          CP32_RELAY_HOST=127.0.0.1 CP32_RELAY_PORT=8787 node relay-src/server.js > artifacts/terminal-action-diag/relay.log 2>&1 &
          echo $! > artifacts/terminal-action-diag/relay.pid
          python3 -m http.server 4173 --bind 127.0.0.1 > artifacts/terminal-action-diag/app.log 2>&1 &
          echo $! > artifacts/terminal-action-diag/app.pid
          sleep 1
      - name: Create and run short action progression diagnostic
        shell: bash
        run: |
          cat > tests/e2e/__terminal-action-diag.spec.js <<'JS'
          import { test, expect, chromium } from '@playwright/test';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { pairByRoomCode, selectFour, waitRemoteCount, startBattle, resolveInteraction } from '../helpers/player-path.js';
          const APP=process.env.CP32_CURRENT_APP_URL;
          const OUT='CP32_TERMINAL_ACTION_DIAGNOSTIC.json';
          const LEGAL='#actionButtons button:not([disabled]):visible, #actionButtons .skillbtn:not([disabled]):visible';
          async function client(name){const dir=fs.mkdtempSync(path.join(os.tmpdir(),`diag-${name}-`));const context=await chromium.launchPersistentContext(dir,{headless:true,viewport:{width:412,height:915},deviceScaleFactor:2.625,hasTouch:true,isMobile:true,userAgent:'Mozilla/5.0 (Linux; Android 14; Pixel 7) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'});const page=context.pages()[0]||await context.newPage();return{name,context,page};}
          async function state(page){return page.evaluate(()=>{const sum=t=>{const a=[...(t?.field||[]),...(t?.bench||[])].filter(Boolean);return{hp:a.reduce((n,u)=>n+Math.max(0,Number(u.hp||0)),0),alive:a.filter(u=>!u.dead&&Number(u.hp||0)>0).length}};return{winner:game?.winner||null,turn:game?.turn||null,serial:Number(game?.turnSerial||0),P:sum(game?.teams?.P),A:sum(game?.teams?.A)};});}
          async function counts(a,b){for(let i=0;i<240;i++){const [ac,bc,as,bs]=await Promise.all([a.page.locator(LEGAL).count(),b.page.locator(LEGAL).count(),state(a.page),state(b.page)]);if(as.winner||bs.winner)return{terminal:true,a:a,b:null};if(ac+bc===1)return{terminal:false,a:ac?a:b,b:ac?b:a};await a.page.waitForTimeout(250);}throw new Error('ACTION_OWNER_TIMEOUT');}
          test('record 40 real UI action choices and HP progression',async()=>{test.setTimeout(240000);const h=await client('h'),g=await client('g');const rows=[];try{await Promise.all([h.page.goto(APP,{waitUntil:'domcontentloaded'}),g.page.goto(APP,{waitUntil:'domcontentloaded'})]);await pairByRoomCode(h.page,g.page);await selectFour(h.page);await waitRemoteCount(g.page,4);await selectFour(g.page);await waitRemoteCount(h.page,4);await startBattle(h.page,g.page);for(let i=0;i<40;i++){const owner=await counts(h,g);if(owner.terminal){rows.push({i,terminal:true,state:await state(h.page)});break;}const actor=owner.a;const before=await state(actor.page);const buttons=actor.page.locator(LEGAL);const n=await buttons.count();const options=[];for(let j=0;j<n;j++){const b=buttons.nth(j);options.push({index:j,text:((await b.textContent())||'').replace(/\s+/g,' ').trim(),html:(await b.innerHTML()).slice(0,1200),class:await b.getAttribute('class')});}let chosen=n-1;for(let j=n-1;j>=0;j--){if(!/에너지\s*모으기|후퇴|교체|대기/.test(options[j].text)){chosen=j;break;}}await buttons.nth(chosen).tap();await resolveInteraction(actor.page);await actor.page.waitForTimeout(500);const after=await state(actor.page);rows.push({i,actor:actor.name,before,options,chosen,chosenText:options[chosen]?.text,after,deltaP:after.P.hp-before.P.hp,deltaA:after.A.hp-before.A.hp});fs.writeFileSync(OUT,JSON.stringify({rows},null,2));}fs.writeFileSync(OUT,JSON.stringify({rows,finalHost:await state(h.page),finalGuest:await state(g.page)},null,2));}finally{await Promise.allSettled([h.context.close(),g.context.close()]);}});
          JS
          set +e
          npx playwright test tests/e2e/__terminal-action-diag.spec.js --workers=1 --reporter=line > artifacts/terminal-action-diag/test.log 2>&1
          echo $? > artifacts/terminal-action-diag/exit.txt
          set -e
      - name: Record diagnostic and cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f CP32_TERMINAL_ACTION_DIAGNOSTIC.json ]; then
            python3 - <<'PY'
          import json,pathlib
          log=pathlib.Path('artifacts/terminal-action-diag/test.log').read_text(errors='replace') if pathlib.Path('artifacts/terminal-action-diag/test.log').exists() else ''
          pathlib.Path('CP32_TERMINAL_ACTION_DIAGNOSTIC.json').write_text(json.dumps({'rows':[],'test_log_tail':log.splitlines()[-80:]},indent=2)+'\n')
          PY
          fi
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('CP32_TERMINAL_ACTION_DIAGNOSTIC.json');d=json.loads(p.read_text());log=pathlib.Path('artifacts/terminal-action-diag/test.log').read_text(errors='replace') if pathlib.Path('artifacts/terminal-action-diag/test.log').exists() else '';d['test_exit_code']=int(pathlib.Path('artifacts/terminal-action-diag/exit.txt').read_text().strip() or 99) if pathlib.Path('artifacts/terminal-action-diag/exit.txt').exists() else 99;d['test_log_tail']=log.splitlines()[-80:];p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          kill "$(cat artifacts/terminal-action-diag/app.pid)" "$(cat artifacts/terminal-action-diag/relay.pid)" 2>/dev/null || true
          rm -f .github/workflows/cp32-terminal-action-diagnostic-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CP32_TERMINAL_ACTION_DIAGNOSTIC.json .github/workflows/cp32-terminal-action-diagnostic-once.yml
          git commit -m 'Record terminal action progression diagnostic'
          git push origin HEAD:main
